function drawEquity(ctx,W,H,equity,cap){
  equity=equity||[];if(equity.length<2){ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);return;}
  var padL=44,padR=8,padT=10,padB=18,cw=W-padL-padR,ch=H-padT-padB;
  var mn=Math.min.apply(null,equity),mx=Math.max.apply(null,equity),r=(mx-mn)||1;
  var xP=function(i){return padL+cw*i/(equity.length-1);},yP=function(v){return padT+ch-((v-mn)/r)*ch;};
  ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(55,55,70,0.3)';ctx.lineWidth=0.5;ctx.font='9px monospace';ctx.textAlign='right';ctx.fillStyle='#6b7280';
  for(var i=0;i<=4;i++){var v=mn+r*i/4,y=yP(v);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+cw,y);ctx.stroke();ctx.fillStyle='#6b7280';ctx.fillText('$'+Math.round(v).toLocaleString(),padL-3,y+3);}
  // baseline (starting capital)
  if(cap>=mn&&cap<=mx){var cy=yP(cap);ctx.strokeStyle='rgba(148,163,184,0.5)';ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(padL,cy);ctx.lineTo(padL+cw,cy);ctx.stroke();ctx.setLineDash([]);}
  var up=equity[equity.length-1]>=equity[0],col=up?'#10b981':'#ef4444';
  var grad=ctx.createLinearGradient(0,padT,0,padT+ch);grad.addColorStop(0,up?'rgba(16,185,129,0.25)':'rgba(239,68,68,0.25)');grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;ctx.beginPath();equity.forEach(function(v,i){var x=xP(i),y=yP(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.lineTo(xP(equity.length-1),padT+ch);ctx.lineTo(padL,padT+ch);ctx.closePath();ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.beginPath();equity.forEach(function(v,i){var x=xP(i),y=yP(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
}

  'Straddle':{legs:[{type:'call',dir:1,k:0,prem:0.035},{type:'put',dir:1,k:0,prem:0.035}],bias:'Volatility',desc:'Buy a call and put at the same strike. Profits on a big move either way.'},
  'Strangle':{legs:[{type:'call',dir:1,k:0.06,prem:0.02},{type:'put',dir:1,k:-0.06,prem:0.02}],bias:'Volatility',desc:'Buy OTM call and put. Cheaper than a straddle, needs a bigger move.'},
  'Calendar Spread':{legs:[{type:'call',dir:-1,k:0,prem:0.02},{type:'call',dir:1,k:0,prem:0.035}],bias:'Neutral',desc:'Sell near-term, buy longer-term same strike. Profits from time decay.'},
  'Collar':{legs:[{type:'stock',dir:1,k:0},{type:'put',dir:1,k:-0.05,prem:0.015},{type:'call',dir:-1,k:0.05,prem:0.015}],bias:'Protective',desc:'Own stock, buy a protective put, sell a call to fund it.'}

function optPayoff(strat,spot,priceAtExp){
  var s=OPT_STRATS[strat];if(!s)return 0;var pnl=0;
  s.legs.forEach(function(L){
    var strike=spot*(1+(L.k||0));var prem=(L.prem||0)*spot;
    if(L.type==='stock'){pnl+=L.dir*(priceAtExp-spot);return;}
    var intrinsic=L.type==='call'?Math.max(0,priceAtExp-strike):Math.max(0,strike-priceAtExp);
    // long pays premium (negative), short collects (positive)
    pnl+=L.dir*intrinsic - L.dir*prem;
  });
  return pnl;
}

ine crosses signal in trend direction.","e":"On cross + price confirmation","s":"Below recent swing","tg":"Trail or measured","v":"crossover"},{"n":"Bollinger Squeeze","cat":"Volatility","d":"Bands contract then expand on breakout.","e":"Breakout bar out of squeeze","s":"Opposite band","tg":"2x band-width move","v":"breakout"},{"n":"Turtle Breakout","cat":"Trend","d":"Classic 20-day high channel breakout.","e":"Break of 20-period high","s":"2x ATR trailing","tg":"Trend exhaustion","v":"breakout"},{"n":"Mean Reversion Band","cat":"Mean-Reversion","d":"Fade price at 2-sigma band extremes.","e":"Reversal at outer band","s":"Beyond band by 1 ATR","tg":"Mid-band (SMA20)","v":"meanrev"},{"n":"Liquidity Grab","cat":"Liquidity","d":"Stop-run beyond a level then snap reversal.","e":"Reclaim after the grab","s":"Beyond the grab extreme","tg":"Opposing liquidity","v":"liquidity"},{"n":"Order Block","cat":"Liquidity","d":"Enter at the last opposing candle before impulse.","e":"Tap of order block + reaction","s":"Beyond the block","tg":"Next imbalance / FVG","v":"zone"},{"n":"Fair Value Gap","cat":"Liquidity","d":"Trade the fill of a price imbalance.","e":"Entry at FVG fill","s":"Beyond the gap","tg":"Prior structure point","v":"zone"},{"n":"Power Hour Trend","cat":"Momentum","d":"Ride the final-hour directional push.","e":"Break of 3pm range","s":"Against the trend swing","tg":"Close / measured move","v":"momentum"},{"n":"Three-Bar Reversal","cat":"Reversal","d":"Three-bar swing reversal off an extreme.","e":"Break of bar-2 extreme","s":"Beyond reversal low/high","tg":"Prior swing","v":"reversal"}];
var COMBOS=[
  {n:'Trend + Pullback',count:2,tag:'2-Strategy Stack',members:['Super Moon','VWAP Bounce'],
   d:'Use a trend filter to pick direction, then a pullback entry to time it. You only take longs while price is above the rising EMAs, and you only enter on a pullback to VWAP \u2014 never chasing.',
   how:['1. Confirm the higher-timeframe trend is up (price above EMA20/50).','2. Wait for a pullback into VWAP or the EMA20.','3. Enter on a reversal candle at the level, stop just below it.','4. Target the prior swing high or trail the EMA20.'],
   why:'Trend gives you the wind at your back; the pullback gives you a tight stop and better reward-to-risk than buying extended.'},
  {n:'Breakout + Volume',count:2,tag:'2-Strategy Stack',members:['Ignition Bar','ORB Breakout'],
   d:'Pair a structural breakout with a volume confirmation so you avoid fakeouts. The opening-range or level break is only valid if the breakout bar prints on expanding volume.',
   how:['1. Mark the opening range or key resistance.','2. Wait for a close above it on above-average volume (the Ignition Bar).','3. Enter on the breakout close; stop below the range.','4. Target a measured move equal to the range height.'],
   why:'Most breakouts fail on weak volume. Requiring an ignition bar filters out the traps and keeps you in only the real ones.'},
  {n:'Reversal + Divergence',count:2,tag:'2-Strategy Stack',members:['Shark Back','RSI Divergence'],
   d:'Catch exhaustion reversals only when momentum confirms. You wait for price to make a new low while RSI makes a higher low, then take the snap-back.',
   how:['1. Spot price pushing to a new low or high.','2. Check RSI is diverging (not confirming the extreme).','3. Enter on the reversal candle, stop beyond the extreme.','4. Target the prior swing in the opposite direction.'],
   why:'Reversals are dangerous alone. Divergence is the second opinion that tells you momentum is already fading before price turns.'},
  {n:'Trend + Pullback + Confirmation',count:3,tag:'3-Strategy Stack',members:['Super Moon','Richie','Split Cross'],
   d:'A three-layer filter: trend sets direction, a Fibonacci pullback sets the level, and a moving-average cross confirms the turn before you commit capital.',
   how:['1. Trend must be up (Super Moon: price above rising EMAs).','2. Wait for a pullback into the 61.8% golden pocket (Richie).','3. Require the EMA9 to cross back above EMA21 there (Split Cross).','4. Enter on the cross, stop below the 78.6% Fib, target the prior high.'],
   why:'Each layer removes a class of bad trades \u2014 wrong direction, bad level, early entry. What survives all three is an A+ setup.'},
  {n:'Breakout + Squeeze + Flow',count:3,tag:'3-Strategy Stack',members:['Enigma Moonshot','Bollinger Squeeze','Delta King'],
   d:'Trade explosive expansion moves. Volatility must be compressed (squeeze), the breakout must clear the band, and order-flow delta must support the direction.',
   how:['1. Identify a Bollinger squeeze (bands at multi-week tightness).','2. Wait for a breakout bar exiting the squeeze (Enigma Moonshot).','3. Confirm cumulative delta is positive in the breakout direction (Delta King).','4. Enter the breakout, stop inside the squeeze range, target a 1.618 extension.'],
   why:'Squeeze tells you a big move is coming, the breakout tells you when, and delta tells you which way smart money is leaning.'},
  {n:'Liquidity + Order Block + FVG',count:3,tag:'3-Strategy Stack (Smart Money)',members:['Plover','Order Block','Fair Value Gap'],
   d:'A full smart-money sequence: price sweeps liquidity, returns to an order block, and fills a fair-value gap before continuing. Institutional-style entries with tight risk.',
   how:['1. Wait for a sweep of obvious highs/lows (Plover liquidity grab).','2. Mark the last opposing candle before the impulse (Order Block).','3. Look for an unfilled imbalance / FVG between the OB and the sweep.','4. Enter on the OB tap into the FVG, stop beyond the sweep, target the next imbalance.'],
   why:'These three concepts describe the same institutional footprint from different angles \u2014 stacked, they pinpoint where big orders actually sit.'},
  {n:'The Full Confluence Stack',count:5,tag:'5-Strategy Power Stack',members:['Super Moon','Anchored VWAP Reclaim','Richie','MACD Cross','Ignition Bar'],
   d:'The highest-conviction setup in the book \u2014 five independent signals must all align before you risk a cent. Rare, but when it triggers, it is your largest-size trade.',
   how:['1. Trend up on the higher timeframe (Super Moon).','2. Price reclaims the anchored VWAP from the last major low.','3. Entry is in the 61.8% golden pocket (Richie).','4. MACD crosses up to confirm momentum.','5. An Ignition Bar fires on volume to trigger entry. Stop below the pocket, scale out at 2R / 3R / trail.'],
   why:'Each added filter cuts the trade count but lifts the win rate. A 5-way confluence is statistically the cleanest edge you can build \u2014 patience is the cost.'},
  {n:'Mean-Reversion Power Stack',count:5,tag:'5-Strategy Power Stack',members:['VWAP Bounce','Mean Reversion Band','RSI Divergence','Three-Bar Reversal','Pivot Reversal'],
   d:'For range and chop days: fade extremes only when five mean-reversion signals agree. Built for the neutral/choppy regime where breakouts fail.',
   how:['1. Price stretches to the outer Bollinger / 2-sigma band.','2. It tags a key pivot or prior level.','3. RSI diverges against the extreme.','4. A three-bar swing reversal prints.','5. Price reclaims VWAP. Enter the fade, stop just beyond the extreme, target the mid-band / VWAP.'],
   why:'Single mean-reversion signals get run over in trends. Demanding five agreements keeps you out of trends and only fading genuine exhaustion.'}
];

function tjFilter(){

    var sd=new Date(journalStart),ed=new Date(journalEnd);ed.setHours(23,59,59);
    t=t.filter(function(x){return x.od>=sd&&x.od<=ed;});
    return t;
  }
  var cut={'1W':7,'2W':14,'30D':30,'60D':60,'90D':90,'3M':90,'6M':180,'1Y':365,'2Y':730,'5Y':1825,'All':99999}[journalRange]||365;
  var cutDate=new Date(now.getTime()-cut*86400000);

function tjStats(t){
  var closed=t.filter(function(x){return x.status==='Closed';});
  var wins=closed.filter(function(x){return x.win;}),losses=closed.filter(function(x){return !x.win;});
  var net=closed.reduce(function(a,x){return a+x.pnl;},0);
  var grossW=wins.reduce(function(a,x){return a+x.pnl;},0),grossL=Math.abs(losses.reduce(function(a,x){return a+x.pnl;},0));
  var avgWin=wins.length?grossW/wins.length:0,avgLoss=losses.length?-grossL/losses.length:0;
  var avgWinPct=wins.length?wins.reduce(function(a,x){return a+x.pnlPct;},0)/wins.length:0;
  var avgLossPct=losses.length?losses.reduce(function(a,x){return a+x.pnlPct;},0)/losses.length:0;
  var maxGain=closed.length?Math.max.apply(null,closed.map(function(x){return x.pnl;})):0;
  var maxLoss=closed.length?Math.min.apply(null,closed.map(function(x){return x.pnl;})):0;
  return {total:t.length,closed:closed.length,open:t.length-closed.length,wins:wins.length,losses:losses.length,
    wr:closed.length?(wins.length/closed.length*100):0,net:net,pf:grossL?grossW/grossL:0,

  var topStories=news.filter(function(n){return n[2]==='top';});

  var sidebar=card('TOP STORIES','<div class="space-y-2">'+topStories.map(function(n){return '<a href="https://www.tradingview.com/markets/indices/#top-stories" target="_blank" rel="noopener" class="block p-2 rounded-lg bg-black/30 hover:bg-white/5 border border-gray-800/40 transition"><div class="text-[11px] font-bold text-white leading-snug">'+n[0]+'</div><div class="text-[9px] text-gray-500 mt-0.5">'+n[1]+' · TradingView</div></a>';}).join('')+'</div>')+card('NEWS','<div class="space-y-2">'+latestNews.map(function(n){return '<a href="https://www.tradingview.com/markets/indices/#news" target="_blank" rel="noopener" class="block p-2 rounded-lg bg-black/30 hover:bg-white/5 border border-gray-800/40 transition"><div class="text-[11px] text-gray-300 leading-snug">'+n[0]+'</div><div class="text-[9px] text-gray-500 mt-0.5">'+n[1]+' · TradingView</div></a>';}).join('')+'</div>');

  var how='<div class="mt-3 text-[10px] text-gray-400 space-y-1"><p class="text-accent font-bold">How to use Global Markets:</p><p>• Click the category tabs (American Market Indices, World Indices, etc.) to filter the table to that region or index family.</p><p>• The table shows live quotes, change, high/low, and a technical rating (Buy/Strong Buy/Sell/Neutral) derived from a confluence of moving averages and momentum.</p><p>• The Daily column shows a mini sparkline of the intraday price action — green for up, red for down.</p><p>• 1 Week, 1 Month and YTD columns let you quickly compare short-term and longer-term performance across indices.</p><p>• Top Stories and News cards on the right link directly to TradingView's market news section. Click any headline to open the full story.</p></div>';

  return '<div class="space-y-3"><h1 class="text-xl font-black text-white"><i class="fa-solid fa-globe text-accent mr-2"></i>Global Markets</h1>'+tabNav+'<div class="grid grid-cols-1 lg:grid-cols-12 gap-3"><div class="lg:col-span-9">'+card(null,table)+'</div><div class="lg:col-span-3 space-y-3">'+sidebar+'</div></div>'+how+'</div>';

3R target','Size your position so the distance to the stop equals ~1% of your account'])+'</div>';};
R.smarttools=function(){
var s=getSym(stSym),spot=parseFloat(s.p)||100;
var views=[['builder','Strategy Builder'],['curve','Curve Analysis'],['probability','Probability'],['delta','Beta-Weighted Delta'],['risk','Risk Stress Test']];
var stratNames=Object.keys(OPT_STRATS);
var tabs='<div class="flex border-b border-gray-800 gap-1 overflow-x-auto">'+views.map(function(v){return '<div data-action="stView" data-arg="'+v[0]+'" class="px-3 py-2 text-xs font-bold cursor-pointer whitespace-nowrap '+(stView===v[0]?'text-accent border-b-2 border-accent':'text-gray-400 hover:text-white')+'">'+v[1]+'</div>';}).join('')+'</div>';
var def=OPT_STRATS[stStrategy];
var body='';

if(stView==='builder'||stView==='curve'){
  // shared config row
  var cfg='<div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-3"><div><label class="text-[8px] text-gray-500 uppercase font-bold">Strategy</label><select id="stStratSel" onchange="stStrategy=this.value;stResult=null;render();" class="w-full bg-black/40 border border-gray-800 rounded-lg px-2 py-1.5 text-xs text-white mt-0.5">'+stratNames.map(function(x){return '<option'+(x===stStrategy?' selected':'')+'>'+x+'</option>';}).join('')+'</select></div><div><label class="text-[8px] text-gray-500 uppercase font-bold">Symbol</label><input id="stSymInput" type="text" value="'+stSym+'" onchange="stSym=this.value.toUpperCase();stResult=null;render();" class="w-full bg-black/40 border border-gray-800 rounded-lg px-2 py-1.5 text-xs text-white uppercase mt-0.5"></div><div class="flex items-end">'+btn('<i class="fa-solid fa-calculator mr-1"></i> Build / Analyze','stBuild','',['bg-accent text-white px-4 py-2 rounded-lg text-xs font-bold w-full'])+'</div></div>';
  // legs table
  var legsTbl=card(stStrategy+' &middot; '+def.bias,'<p class="text-xs text-gray-300 mb-2">'+def.desc+'</p><div class="overflow-x-auto"><table class="w-full text-[11px]"><thead><tr class="text-gray-500 uppercase text-[8px] border-b border-gray-800">'+['Leg','Type','Direction','Strike','Est. Premium'].map(function(h){return '<th class="text-left py-1.5 px-2">'+h+'</th>';}).join('')+'</tr></thead><tbody>'+def.legs.map(function(L,i){var strike=L.type==='stock'?spot:spot*(1+(L.k||0));return '<tr class="border-b border-gray-800/40"><td class="py-1.5 px-2 text-gray-500">'+(i+1)+'</td><td class="px-2 font-bold text-white capitalize">'+L.type+'</td><td class="px-2 '+(L.dir>0?'text-success':'text-danger')+' font-bold">'+(L.dir>0?'Long / Buy':'Short / Sell')+'</td><td class="px-2 text-gray-300 font-mono">$'+strike.toFixed(2)+'</td><td class="px-2 text-gray-400 font-mono">'+(L.prem?'$'+(L.prem*spot).toFixed(2):'\u2014')+'</td></tr>';}).join('')+'</tbody></table></div>');
  if(stView==='builder'){
    body=cfg+legsTbl+
      (stResult?card('RESULT SUMMARY','<div class="grid grid-cols-2 md:grid-cols-4 gap-2">'+stat('Max Profit',stResult.maxP>1e6?'Unlimited':'$'+stResult.maxP.toFixed(0),'text-success')+stat('Max Loss',stResult.maxL<-1e6?'Unlimited':'$'+Math.abs(stResult.maxL).toFixed(0),'text-danger')+stat('Breakevens',stResult.bes.length?stResult.bes.map(function(b){return '$'+b;}).join(', '):'\u2014')+stat('Prob. of Profit',stResult.pop+'%',parseFloat(stResult.pop)>=50?'text-success':'text-gold')+'</div>'):'<div class="text-center text-xs text-gray-500 py-3">Press Build / Analyze to calculate the payoff and stats.</div>')+
      howto('Strategy Builder',['Pick from '+stratNames.length+' preset options strategies (covered call, iron condor, straddle, and more)','Set the underlying symbol; strikes are placed around the live price','Press Build / Analyze to see the legs, max profit/loss, breakevens and probability of profit','Switch to Curve Analysis to see the full payoff diagram']);
  } else { // curve
    body=cfg+(stResult?card('PAYOFF CURVE','<canvas data-c="payoff" class="w-full h-64 rounded-xl"></canvas><div class="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2">'+stat('Max Profit',stResult.maxP>1e6?'Unlimited':'$'+stResult.maxP.toFixed(0),'text-success')+stat('Max Loss',stResult.maxL<-1e6?'Unlimited':'$'+Math.abs(stResult.maxL).toFixed(0),'text-danger')+stat('Breakevens',stResult.bes.length?stResult.bes.map(function(b){return '$'+b;}).join(', '):'\u2014')+stat('Prob. of Profit',stResult.pop+'%')+'</div>'):'<div class="text-center text-xs text-gray-500 py-10"><i class="fa-solid fa-chart-area text-2xl text-gray-700 mb-2"></i><div>Press Build / Analyze to draw the payoff-at-expiration curve.</div></div>')+
      howto('Curve Analysis',['The purple line is your profit/loss at expiration across every price','Green zones are profit, red zones are loss; the dashed amber line is the current price','Blue dots mark breakeven prices','Adjust the strategy or symbol and re-run to compare shapes']);
  }
}
else if(stView==='probability'){
  // probability of profit / percent-of-profit explainer with a few strategies compared
  var compare=['Long Call','Iron Condor','Cash-Secured Put','Strangle'].map(function(name){
    var win=0,tot=0;for(var z=-3;z<=3;z+=0.05){var sigma=spot*0.1;var px=spot+z*sigma;var w=Math.exp(-z*z/2);tot+=w;if(optPayoff(name,spot,px)>0)win+=w;}
    return {n:name,pop:Math.round(win/tot*100),bias:OPT_STRATS[name].bias};
  });
  body=card('PROBABILITY OF PROFIT (POP)','<p class="text-xs text-gray-300 mb-3">Probability of Profit estimates the chance a position is profitable at expiration, modeling the price as a normal distribution around the current price (width set by implied volatility). High-POP strategies win often but usually risk more than they make per trade.</p><div class="space-y-2">'+compare.map(function(c){var col=c.pop>=60?'#10b981':c.pop>=45?'#f59e0b':'#ef4444';return '<div><div class="flex justify-between text-[11px] mb-1"><span class="text-white font-bold">'+c.n+' <span class="text-gray-500 font-normal">('+c.bias+')</span></span><span style="color:'+col+'" class="font-bold">'+c.pop+'%</span></div><div class="w-full bg-black/40 rounded-full h-2"><div class="h-2 rounded-full" style="width:'+c.pop+'%;background:'+col+'"></div></div></div>';}).join('')+'</div>')+
    card('PERCENT-OF-PROFIT TARGETS','<p class="text-xs text-gray-300 mb-2">Rather than picking a random price target, set a profit target as a percent of max profit. A common rule for premium-selling strategies is to take profits at 50% of the credit received.</p><div class="grid grid-cols-3 gap-2 text-center">'+[['25%','Conservative scalp'],['50%','Classic target'],['75%','Let it ride']].map(function(p){return '<div class="bg-black/30 rounded-lg p-3"><div class="text-lg font-black text-accent">'+p[0]+'</div><div class="text-[9px] text-gray-500">'+p[1]+'</div></div>';}).join('')+'</div>')+
    howto('Probability',['POP estimates how often a trade finishes profitable, not how much it makes','High-POP trades (credit spreads, condors) win often but risk more than they earn','Low-POP trades (long options) lose often but pay big when right','Pair POP with reward-to-risk \u2014 neither number alone tells the whole story']);
}
else if(stView==='delta'){
  // beta-weighted delta of a sample portfolio
  var port=[['SPY',120,1.0],['AAPL',80,1.12],['NVDA',45,1.65],['TSLA',30,1.85],['MSFT',60,0.95]];
  var totalBwd=0;var rows=port.map(function(p){var ps=getSym(p[0]),px=parseFloat(ps.p)||100;var posDelta=p[1];var bwd=posDelta*p[2]*(px/spot);totalBwd+=bwd;return {sym:p[0],shares:p[1],beta:p[2],px:px,delta:posDelta,bwd:bwd};});
  body=card('BETA-WEIGHTED DELTA (vs SPY)','<p class="text-xs text-gray-300 mb-3">Beta-weighting converts every position\u2019s directional risk into equivalent shares of a benchmark (SPY), so you can see your <span class="text-white">net market exposure</span> in one number \u2014 even across different stocks.</p><div class="overflow-x-auto"><table class="w-full text-[11px]"><thead><tr class="text-gray-500 uppercase text-[8px] border-b border-gray-800">'+['Symbol','Position Delta','Beta','Price','BW Delta (SPY)'].map(function(h){return '<th class="text-left py-1.5 px-2">'+h+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(r){return '<tr class="border-b border-gray-800/40"><td class="py-1.5 px-2 font-bold text-white">'+r.sym+'</td><td class="px-2 text-gray-300">'+r.delta+'</td><td class="px-2 text-gray-400">'+r.beta+'</td><td class="px-2 text-gray-400 font-mono">$'+r.px.toFixed(2)+'</td><td class="px-2 '+(r.bwd>=0?'text-success':'text-danger')+' font-bold font-mono">'+r.bwd.toFixed(0)+'</td></tr>';}).join('')+'</tbody></table></div><div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-800"><span class="text-xs text-gray-400 font-bold">Net Beta-Weighted Delta</span><span class="text-lg font-black '+(totalBwd>=0?'text-success':'text-danger')+'">'+totalBwd.toFixed(0)+' SPY \u0394</span></div>')+
    card('WHAT IT MEANS','<div class="grid grid-cols-1 md:grid-cols-3 gap-2 text-[10px]"><div class="bg-success/8 border border-success/20 rounded-xl p-3"><div class="text-success font-black uppercase text-[9px] mb-1">Positive Net Delta</div><p class="text-gray-300">Portfolio profits if the market rises. You are net long.</p></div><div class="bg-gold/8 border border-gold/20 rounded-xl p-3"><div class="text-gold font-black uppercase text-[9px] mb-1">Near Zero</div><p class="text-gray-300">Delta-neutral \u2014 little directional exposure to the broad market.</p></div><div class="bg-danger/8 border border-danger/20 rounded-xl p-3"><div class="text-danger font-black uppercase text-[9px] mb-1">Negative Net Delta</div><p class="text-gray-300">Portfolio profits if the market falls. You are net short.</p></div></div>')+
    howto('Beta-Weighted Delta',['Each position is converted to equivalent shares of SPY using its beta','Add them up to get total market exposure in one number','A net delta near zero means you are hedged against broad moves','Adjust positions to dial your exposure up or down to your conviction']);
}
else { // risk stress test
  var scenarios=[['Market +10%',10],['Market +5%',5],['Flat',0],['Market -5%',-5],['Market -10%',-10],['Market -20% (crash)',-20]];
  var portVal=185000;
  body=card('PORTFOLIO STRESS TEST','<p class="text-xs text-gray-300 mb-3">A stress test re-prices your portfolio under hypothetical market moves and volatility shocks, so you can see the damage <span class="text-white">before</span> it happens.</p><div class="overflow-x-auto"><table class="w-full text-[11px]"><thead><tr class="text-gray-500 uppercase text-[8px] border-b border-gray-800">'+['Scenario','P/L','% Change','New Value'].map(function(h){return '<th class="text-left py-1.5 px-2">'+h+'</th>';}).join('')+'</tr></thead><tbody>'+scenarios.map(function(sc){var beta=1.15;var pct=sc[1]*beta;var pl=portVal*pct/100;var nv=portVal+pl;var pc=pl>=0?'text-success':'text-danger';return '<tr class="border-b border-gray-800/40 '+(sc[1]===0?'bg-white/5':'')+'"><td class="py-1.5 px-2 font-bold text-white">'+sc[0]+'</td><td class="px-2 '+pc+' font-bold font-mono">'+(pl>=0?'+':'')+'$'+Math.abs(pl).toLocaleString(undefined,{maximumFractionDigits:0})+'</td><td class="px-2 '+pc+' font-mono">'+(pct>=0?'+':'')+pct.toFixed(1)+'%</td><td class="px-2 text-gray-300 font-mono">$'+nv.toLocaleString(undefined,{maximumFractionDigits:0})+'</td></tr>';}).join('')+'</tbody></table></div>')+
    card('VOLATILITY SHOCK','<div class="grid grid-cols-3 gap-2 text-center">'+[['IV +50%','+$3,200','text-success'],['IV flat','$0','text-gray-400'],['IV -50%','-$2,800','text-danger']].map(function(v){return '<div class="bg-black/30 rounded-lg p-3"><div class="text-[9px] text-gray-500 uppercase">'+v[0]+'</div><div class="text-sm font-black '+v[2]+'">'+v[1]+'</div></div>';}).join('')+'</div><p class="text-[10px] text-gray-500 mt-2">Vega exposure: long-premium positions gain when IV rises; short-premium positions gain when IV falls.</p>')+

R.cryptodash=function(){

  var showLong=activeSub.cdLong!=='false';
  var showShort=activeSub.cdShort!=='false';
  var rows=coins.map(function(c){
    var seed=0;for(var i=0;i<c.length;i++)seed+=c.charCodeAt(i)*(i+3);
    var rng=function(i){return Math.abs(Math.sin(seed*3.7+i*2.9))%1;};
    var fastB=(20+rng(1)*15).toFixed(2),slowB=(20+rng(2)*15).toFixed(2),rsiB=Math.round(40+rng(3)*40),rsiMaB=Math.round(40+rng(4)*40);
    var fastU=(20+rng(5)*15).toFixed(2),slowU=(20+rng(6)*15).toFixed(2),rsiU=Math.round(40+rng(7)*40),rsiMaU=Math.round(40+rng(8)*40);
    var upB=parseFloat(fastB)>parseFloat(slowB)&&rsiB>50&&rsiB>rsiMaB;
    var dnB=parseFloat(fastB)<parseFloat(slowB)&&rsiB<50&&rsiMaB>rsiB;
    var upU=parseFloat(fastU)>parseFloat(slowU)&&rsiU>50&&rsiU>rsiMaU;
    var dnU=parseFloat(fastU)<parseFloat(slowU)&&rsiU<50&&rsiMaU>rsiU;
    var long=upB&&upU;
    var short=dnB&&dnU;
    var conf=Math.round(50+rng(9)*45);
    var price=(0.1+rng(10)*5000).toFixed(2); if(c==='BTC')price=67250; if(c==='ETH')price=3520;
    var entry=price;var stop=(parseFloat(price)*(long?0.96:short?1.04:0.98)).toFixed(2);var tgt=(parseFloat(price)*(long?1.08:short?0.92:1.04)).toFixed(2);
    var sig='HOLD';var col='text-gray-400';var bg='bg-gray-800';
    if(long){sig='LONG';col='text-success';bg='bg-success/15';}
    else if(short){sig='SHORT';col='text-danger';bg='bg-danger/15';}
    if((!showLong&&sig==='LONG')||(!showShort&&sig==='SHORT'))return null;
    return {c:c,long:long,short:short,conf:conf,price:price,entry:entry,stop:stop,tgt:tgt,sig:sig,col:col,bg:bg,rsiB:rsiB,rsiU:rsiU,fastB:fastB,slowB:slowB,fastU:fastU,slowU:slowU};
  }).filter(function(x){return x;});

R.forex=function(){
  var pairs=['EURUSD','GBPUSD','USDJPY','AUDUSD','USDCAD','USDCHF','NZDUSD','EURGBP','EURJPY','GBPJPY'];
  var showLong=activeSub.fxLong!=='false';
  var showShort=activeSub.fxShort!=='false';
  var rows=pairs.map(function(c){
    var seed=0;for(var i=0;i<c.length;i++)seed+=c.charCodeAt(i)*(i+7);
    var rng=function(i){return Math.abs(Math.sin(seed*5.3+i*4.1))%1;};
    var fast=(20+rng(1)*15).toFixed(2),slow=(20+rng(2)*15).toFixed(2),rsi=Math.round(40+rng(3)*40),rsiMa=Math.round(40+rng(4)*40);
    var up=parseFloat(fast)>parseFloat(slow)&&rsi>50&&rsi>rsiMa;
    var dn=parseFloat(fast)<parseFloat(slow)&&rsi<50&&rsiMa>rsi;
    var long=up;var short=dn;
    var conf=Math.round(50+rng(5)*45);
    var price=(1.0+rng(6)*150).toFixed(3); if(c.indexOf('JPY')>=0)price=(80+rng(6)*70).toFixed(3);
    var entry=price;var stop=(parseFloat(price)*(long?0.995:short?1.005:0.998)).toFixed(3);var tgt=(parseFloat(price)*(long?1.012:short?0.988:1.005)).toFixed(3);
    var sig='HOLD';var col='text-gray-400';var bg='bg-gray-800';
    if(long){sig='LONG';col='text-success';bg='bg-success/15';}
    else if(short){sig='SHORT';col='text-danger';bg='bg-danger/15';}
    if((!showLong&&sig==='LONG')||(!showShort&&sig==='SHORT'))return null;
    return {c:c,long:long,short:short,conf:conf,entry:entry,stop:stop,tgt:tgt,sig:sig,col:col,bg:bg,rsi:rsi,fast:fast,slow:slow};
