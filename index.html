function drawCandles(ctx,W,H,t){
  t=t||ticker;var s=getSym(t);
  var padR=58,padL=8,padT=22,padB=8;
  var volH=Math.floor(H*0.15),priceH=H-volH-padT-padB-8,chartW=W-padL-padR;
  var n=60,cw=chartW/n,base=parseFloat(s.p)||100,seed=0;
  for(var i=0;i<t.length;i++)seed+=t.charCodeAt(i);
  var rng=function(i){return(Math.abs(Math.sin(seed*9301+i*49297*0.0001))%1);};
  var candles=[];
  for(var i=0;i<n;i++){var ch=(rng(i)-0.45)*0.022;var o=base,cl=base*(1+ch);var sp=Math.abs(cl-o)/Math.max(o,0.01);candles.push({o:o,c:cl,h:Math.max(o,cl)*(1+rng(i+100)*0.006+sp*0.3),l:Math.min(o,cl)*(1-rng(i+200)*0.006-sp*0.3),v:0.3+rng(i+300)*0.7});base=cl;}
  var aH=Math.max.apply(null,candles.map(function(c){return c.h})),aL=Math.min.apply(null,candles.map(function(c){return c.l})),pr=aH-aL||1;
  var mxV=Math.max.apply(null,candles.map(function(c){return c.v}));
  var yP=function(p){return padT+priceH-((p-aL)/pr)*priceH;};
  ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(55,55,70,0.35)';ctx.lineWidth=0.5;ctx.font='10px monospace';ctx.textAlign='right';
  for(var i=0;i<=5;i++){var price=aL+(pr*i/5),y=yP(price);ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+chartW,y);ctx.stroke();ctx.fillStyle='#6b7280';ctx.fillText(price.toFixed(2),W-4,y+3);}
  var volY=padT+priceH+8;
  ctx.strokeStyle='rgba(55,55,70,0.5)';ctx.beginPath();ctx.moveTo(padL,volY+volH);ctx.lineTo(padL+chartW,volY+volH);ctx.stroke();
  var e20=base;ctx.strokeStyle='#8b5cf6';ctx.lineWidth=1.5;ctx.beginPath();
  candles.forEach(function(c,i){e20=c.c*0.095+e20*0.905;var x=padL+i*cw+cw/2,y=yP(e20);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  var e50=base;ctx.strokeStyle='#3b82f6';ctx.lineWidth=1.5;ctx.beginPath();
  candles.forEach(function(c,i){e50=c.c*0.039+e50*0.961;var x=padL+i*cw+cw/2,y=yP(e50);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  var cPV=0,cV=0;ctx.strokeStyle='rgba(245,158,11,0.6)';ctx.lineWidth=1;ctx.beginPath();
  candles.forEach(function(c,i){var tp=(c.h+c.l+c.c)/3;cPV+=tp*c.v;cV+=c.v;var vw=cPV/cV;var x=padL+i*cw+cw/2,y=yP(vw);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  candles.forEach(function(c,i){var x=padL+i*cw+0.5,w=Math.max(cw-1.5,2);var bull=c.c>=c.o,col=bull?'#10b981':'#ef4444';var yO=yP(c.o),yC=yP(c.c),yH=yP(c.h),yL=yP(c.l);ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x+w/2,yH);ctx.lineTo(x+w/2,yL);ctx.stroke();ctx.fillStyle=col;ctx.fillRect(x,Math.min(yO,yC),w,Math.max(Math.abs(yC-yO),2));
  var vh=(c.v/mxV)*volH;ctx.globalAlpha=0.4;ctx.fillRect(x,volY+volH-vh+1,Math.max(w-0.5,1),vh);ctx.globalAlpha=1;});
  var lp=candles[n-1].c,ly=yP(lp);ctx.fillStyle='#8b5cf6';ctx.fillRect(padL+chartW,ly-8,padR,16);ctx.fillStyle='#fff';ctx.font='bold 10px monospace';ctx.textAlign='center';ctx.fillText(lp.toFixed(2),padL+chartW+padR/2,ly+3);
  ctx.textAlign='left';ctx.font='bold 12px sans-serif';ctx.fillStyle='#8b5cf6';ctx.fillText(t+'  $'+s.p+'  '+(s.c>=0?'+':'')+s.c+'%',padL,padT-6);
  ctx.font='9px monospace';ctx.fillStyle='#8b5cf6';ctx.fillText('EMA20',padL+150,padT-6);ctx.fillStyle='#3b82f6';ctx.fillText('EMA50',padL+195,padT-6);ctx.fillStyle='rgba(245,158,11,0.9)';ctx.fillText('VWAP',padL+240,padT-6);
}
function drawLine(ctx,W,H){
  var pts=[],seed=42;for(var i=0;i<50;i++)pts.push(0.2+Math.abs(Math.sin(seed+i*0.37))%1*0.6);
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),r=mx-mn||1;
  ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(55,55,70,0.25)';ctx.lineWidth=0.5;for(var i=0;i<4;i++){var y=14+((H-20)*i/3);ctx.beginPath();ctx.moveTo(6,y);ctx.lineTo(W-6,y);ctx.stroke();}
  var grad=ctx.createLinearGradient(0,14,0,H);grad.addColorStop(0,'rgba(139,92,246,0.25)');grad.addColorStop(1,'rgba(139,92,246,0)');
  ctx.fillStyle=grad;ctx.beginPath();pts.forEach(function(p,i){var x=6+((W-12)*i/49),y=14+(H-20)-((p-mn)/r)*(H-24);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.lineTo(W-6,H-6);ctx.lineTo(6,H-6);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2;ctx.beginPath();pts.forEach(function(p,i){var x=6+((W-12)*i/49),y=14+(H-20)-((p-mn)/r)*(H-24);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  var lx=6+((W-12)*49/49),ly=14+(H-20)-((pts[49]-mn)/r)*(H-24);ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.arc(lx,ly,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lx,ly,2,0,Math.PI*2);ctx.fill();
}
function drawGauge(ctx,W,H,v,label){
  var cx=W/2,cy=H*0.82,r=Math.min(W/2-8,H*0.6);
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,2*Math.PI);ctx.strokeStyle='#1e222d';ctx.lineWidth=14;ctx.stroke();
  [[0,.25,'#ef4444'],[.25,.45,'#f59e0b'],[.45,.55,'#6b7280'],[.55,.75,'#10b981'],[.75,1,'#3b82f6']].forEach(function(z){ctx.beginPath();ctx.arc(cx,cy,r,Math.PI+z[0]*Math.PI,Math.PI+z[1]*Math.PI);ctx.strokeStyle=z[2];ctx.lineWidth=14;ctx.stroke();});
  var na=Math.PI+(v/100)*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(na)*r*0.78,cy+Math.sin(na)*r*0.78);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(v),cx,cy-12);
  if(label){ctx.font='10px sans-serif';ctx.fillStyle='#9ca3af';ctx.fillText(label,cx,cy+16);}ctx.textAlign='left';
}
function drawBar(ctx,W,H,data){
  ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);
  var max=Math.max.apply(null,data.map(function(d){return Math.abs(d.v);}));var bw=W/data.length*0.7;
  data.forEach(function(d,i){var bh=Math.abs(d.v)/max*(H-20);var x=i*(W/data.length)+5;var y=d.v>=0?H-10-bh:H-10;
  ctx.fillStyle=d.c||'#8b5cf6';ctx.fillRect(x,y,bw,bh);ctx.fillStyle='#6b7280';ctx.font='8px monospace';ctx.textAlign='center';ctx.fillText(d.l,x+bw/2,H-2);});
}
function afterRender(){
  document.querySelectorAll('canvas[data-c]').forEach(function(cv){
    var dpr=window.devicePixelRatio||1;var rect=cv.getBoundingClientRect();
    if(rect.width<2||rect.height<2)return;
    cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);
    var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
    var t=cv.getAttribute('data-c');
    if(t==='candles')drawCandles(ctx,rect.width,rect.height,cv.getAttribute('data-t'));
    else if(t==='line')drawLine(ctx,rect.width,rect.height);
    else if(t==='gauge')drawGauge(ctx,rect.width,rect.height,parseFloat(cv.getAttribute('data-v')),cv.getAttribute('data-l'));
    else if(t==='bar'){var data=JSON.parse(cv.getAttribute('data-bar')||'[]');drawBar(ctx,rect.width,rect.height,data);}
  });
}

else if(sub==='technical')body='<div class="grid grid-cols-2 gap-2">'+stat('RSI',s.rsi,s.rsi>70?'text-danger':'')+stat('MACD','Bullish','text-success')+stat('EMA20','$'+s.p)+stat('ATR',s.atr)+'</div>'+card('SIGNAL','<div class="p-3 bg-success/10 border border-success/20 rounded-lg text-xs"><span class="text-success font-bold">BULLISH</span> - Above EMAs and VWAP. Entry: $'+s.p+' Stop: $'+(s.p*0.97).toFixed(2)+' Target: $'+(s.p*1.05).toFixed(2)+'</div>');
else body='<div class="space-y-2">'+[ticker+' beats Q2 estimates by 12%, revenue up 34%',ticker+' announces new partnership with major retailer','Analysts upgrade '+ticker+' to Strong Buy','Institutional investors increase '+ticker+' holdings',ticker+' CEO discusses growth strategy on CNBC'].map(function(n,i){return '<div class="flex items-start gap-2 p-2 bg-panel border border-gray-800 rounded-lg">'+logo(ticker,28)+'<div><div class="text-xs text-gray-200 font-semibold">'+n+'</div><div class="text-[9px] text-gray-600 mt-0.5">'+(i+1)+'h ago - '+['Reuters','Bloomberg','MarketWatch','CNBC','Seeking Alpha'][i]+'</div></div></div>';}).join('')+'</div>';
return '<div class="space-y-3"><div class="flex justify-between"><div class="flex items-center gap-2">'+logo(ticker,36)+'<div><h1 class="text-xl font-black text-white">'+ticker+' <span class="text-sm '+pctC(s.c)+'">'+pctA(s.c)+' '+Math.abs(s.c)+'%</span></h1><div class="text-xs text-gray-500">'+s.n+'</div></div></div><input id="symSearch" type="text" placeholder="Search..." value="'+ticker+'" class="bg-black/40 border border-gray-800 rounded-lg px-2 py-1 text-xs text-white uppercase" onchange="ticker=this.value.toUpperCase();render();"></div><div class="flex border-b border-gray-800 gap-1">'+tabs.map(function(t){return '<div data-action="sub" data-key="symbol" data-arg="'+t[0]+'" class="px-3 py-2 text-xs font-bold cursor-pointer '+(sub===t[0]?'text-accent border-b-2 border-accent':'text-gray-400')+'">'+t[1]+'</div>';}).join('')+'</div>'+body+'</div>'+howto('Symbol',["View stock data","Add to watchlist","Price, volume, RSI, fundamentals"]);};

R.options=function(){var s=getSym(ticker);var spot=parseFloat(s.p)||100;return '<div class="space-y-3"><h1 class="text-xl font-black text-white">Options Chain</h1><div class="grid grid-cols-3 gap-2">'+stat('Spot','$'+spot)+stat('IV','25%','text-gold')+stat('DTE','30')+'</div>'+card('CHAIN','<div class="space-y-1">'+Array.from({length:7},function(_,i){var k=(spot+(i-3)*spot*0.05).toFixed(2);return '<div class="flex justify-between text-xs py-1.5 border-b border-gray-800/50"><span class="text-success font-mono">'+(Math.max(0.01,spot-k+2)).toFixed(2)+'</span><span class="text-accent font-bold">'+k+'</span><span class="text-danger font-mono">'+(Math.max(0.01,k-spot+2)).toFixed(2)+'</span></div>';}).join('')+'</div>')+'</div>'+howto('Options',["CALL=right to buy","PUT=right to sell","Premium=contract price"]);};
R.analysis=function(){
  var s=getSym(ticker);
  var spot=parseFloat(s.p)||100;
  return '<div class="space-y-3"><h1 class="text-xl font-black text-white">Options Analysis & Payoff</h1>'+
  '<div class="grid grid-cols-2 md:grid-cols-4 gap-2 mb-2">'+
    stat('Spot','$'+spot)+stat('IV Rank','25%','text-gold')+stat('DTE','30')+stat('IV','45%','text-accent')+
  '</div>'+
  '<div class="grid grid-cols-2 md:grid-cols-4 gap-2">'+
    '<div class="bg-panel border border-gray-800 rounded-xl p-3"><div class="text-[8px] text-gray-500 uppercase font-bold">Delta</div><div class="text-sm font-black text-success">0.42</div><div class="text-[8px] text-gray-600 mt-0.5">For every $1 move in stock, option gains $0.42. 0.42 = roughly 42% chance of finishing ITM.</div></div>'+
    '<div class="bg-panel border border-gray-800 rounded-xl p-3"><div class="text-[8px] text-gray-500 uppercase font-bold">Gamma</div><div class="text-sm font-black text-white">0.012</div><div class="text-[8px] text-gray-600 mt-0.5">Rate of Delta change. Higher = more volatile Delta. Peak at ATM strikes.</div></div>'+
    '<div class="bg-panel border border-gray-800 rounded-xl p-3"><div class="text-[8px] text-gray-500 uppercase font-bold">Theta</div><div class="text-sm font-black text-danger">-2.40</div><div class="text-[8px] text-gray-600 mt-0.5">Time decay. Option loses $2.40/day. Accelerates near expiration.</div></div>'+
    '<div class="bg-panel border border-gray-800 rounded-xl p-3"><div class="text-[8px] text-gray-500 uppercase font-bold">Vega</div><div class="text-sm font-black text-white">12.50</div><div class="text-[8px] text-gray-600 mt-0.5">For every 1% IV change, option gains/loses $12.50. High Vega = sensitive to volatility.</div></div>'+
  '</div>'+
  card('STRATEGY BUILDER','<div class="flex gap-1 mb-3 flex-wrap">'+
    ['Long Call','Long Put','Bull Call Spread','Bear Put Spread','Iron Condor','Straddle','Strangle','Covered Call','Cash-Secured Put'].map(function(s,i){
      return '<span class="px-2.5 py-1 rounded-full text-[9px] font-bold cursor-pointer '+(i===0?'bg-accent text-white':'bg-black/30 text-gray-400 border border-gray-800')+'">'+s+'</span>';
    }).join('')+
  '</div>'+
  '<div class="grid grid-cols-3 gap-2 mb-2">'+
    '<div class="bg-black/30 rounded p-2"><div class="text-[8px] text-gray-500 uppercase font-bold">Leg 1</div><div class="text-[10px] text-success">+1 CALL $'+(spot*0.95).toFixed(0)+'</div><div class="text-[9px] text-gray-500">30 DTE | Delta 0.42</div></div>'+
    '<div class="bg-black/30 rounded p-2"><div class="text-[8px] text-gray-500 uppercase font-bold">Leg 2</div><div class="text-[10px] text-danger">-1 CALL $'+(spot*1.05).toFixed(0)+'</div><div class="text-[9px] text-gray-500">30 DTE | Delta -0.15</div></div>'+
    '<div class="bg-black/30 rounded p-2"><div class="text-[8px] text-gray-500 uppercase font-bold">Net</div><div class="text-[10px] text-white font-bold">Debit $3.20</div><div class="text-[9px] text-gray-500">Max Profit: $'+((spot*1.05)-(spot*0.95)-3.20).toFixed(0)+'</div></div>'+
  '</div>')+
  card('P&L AT EXPIRATION','<canvas data-c="line" class="w-full h-48 rounded-xl mb-3"></canvas>'+
  '<div class="grid grid-cols-3 gap-2 text-center">'+
    '<div class="bg-danger/5 border border-danger/15 rounded-lg p-2"><div class="text-[8px] text-danger uppercase font-bold">Max Loss</div><div class="text-sm font-black text-danger">-$320</div><div class="text-[8px] text-gray-500">If below strike</div></div>'+
    '<div class="bg-gray-800/30 border border-gray-800 rounded-lg p-2"><div class="text-[8px] text-gray-400 uppercase font-bold">Breakeven</div><div class="text-sm font-black text-white">$'+(spot*0.98).toFixed(0)+'</div><div class="text-[8px] text-gray-500">Stock price needed</div></div>'+
    '<div class="bg-success/5 border border-success/15 rounded-lg p-2"><div class="text-[8px] text-success uppercase font-bold">Max Profit</div><div class="text-sm font-black text-success">+$680</div><div class="text-[8px] text-gray-500">If at upper strike</div></div>'+
  '</div>')+
  card('HOW TO USE','<div class="text-xs text-gray-400 space-y-1.5">'+
    '<p><span class="text-accent font-bold">Step 1:</span> Select a strategy from the chips above.</p>'+
    '<p><span class="text-accent font-bold">Step 2:</span> The legs auto-populate with current Greeks.</p>'+
    '<p><span class="text-accent font-bold">Step 3:</span> Check the payoff chart for profit/loss zones.</p>'+
    '<p><span class="text-accent font-bold">Step 4:</span> Green area = profit zone. Red area = loss zone.</p>'+
    '<p><span class="text-gold font-bold">Delta:</span> Measures directional exposure. +0.42 = moderately bullish.</p>'+
    '<p><span class="text-gold font-bold">Gamma:</span> How fast Delta changes. Higher near ATM.</p>'+
    '<p><span class="text-gold font-bold">Theta:</span> Time decay enemy. Sell high Theta, buy low.</p>'+
    '<p><span class="text-gold font-bold">Vega:</span> Volatility sensitivity. Sell high IV, buy low IV.</p>'+
  '</div>')+
  '</div>'+howto('Analysis',["Weekly for big picture","Daily for entry timing","RSI for momentum"]);
};;

R.backtest=function(){return '<div class="space-y-3"><h1 class="text-xl font-black text-white">Backtesting</h1><div class="grid grid-cols-3 gap-2">'+stat('Trades','1,247')+stat('Win Rate','61.3%','text-success')+stat('Sharpe','2.18','text-gold')+'</div>'+card('EQUITY CURVE','<canvas data-c="line" class="w-full h-48 rounded-xl"></canvas>')+'</div>'+howto('Backtest',["Select symbol/strategy/period","Click Run to simulate","Review equity curve and metrics","Optimize before real capital"]);};
R.correlation=function(){
  var a=['SPY','QQQ','IWM','TLT','GLD','BTC'];
  function bg(v){return v>0.7?'bg-success/40':v>0.3?'bg-success/20':v>-0.3?'bg-gray-700':'bg-danger/30';}
  var tbl='<table class="w-full text-xs text-center"><thead><tr><th></th>'+a.map(function(x){return '<th class="text-[9px] text-gray-500 p-1">'+x+'</th>';}).join('')+'</tr></thead><tbody>';
  a.forEach(function(r,i){tbl+='<tr><td class="text-gray-500 font-bold p-1 text-[10px]">'+r+'</td>';a.forEach(function(cc,j){var v=i===j?'1.00':(0.9-Math.abs(i-j)*0.15).toFixed(2);tbl+='<td class="p-1"><div class="'+bg(parseFloat(v))+' rounded py-1 font-mono text-[10px] font-bold text-white">'+v+'</div></td>';});tbl+='</tr>';});
  tbl+='</tbody></table>';
  return '<div class="space-y-3"><h1 class="text-xl font-black text-white">Correlation Matrix</h1>'+
  '<div class="grid grid-cols-3 gap-2 mb-2">'+stat('Assets','6')+stat('Lowest Corr','BTC vs TLT')+stat('Highest Corr','SPY vs QQQ')+'</div>'+
  card('6x6 CORRELATION MATRIX',tbl)+
  card('HOW TO READ & USE','<div class="text-xs text-gray-400 space-y-2">'+
    '<p><span class="text-success font-bold">Green (0.7-1.0):</span> Highly correlated. Move together. Holding both = not diversified, just leveraged.</p>'+
    '<p><span class="text-gray-500 font-bold">Gray (-0.3 to 0.3):</span> Low correlation. Good for diversification. Independent moves.</p>'+
    '<p><span class="text-danger font-bold">Red (below -0.3):</span> Inverse correlation. When one goes up, other goes down. Use for hedging.</p>'+
    '<p><span class="text-accent font-bold">PRO TIP:</span> Add BTC to a stock portfolio - it has low correlation to SPY, improving risk-adjusted returns.</p>'+
    '<p><span class="text-gold font-bold">HEDGING:</span> TLT (bonds) often moves inverse to SPY (stocks). Hold both to reduce portfolio volatility.</p>'+
