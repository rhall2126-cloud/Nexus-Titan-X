.toggle-on{background:var(--success)!important}.toggle-off{background:#374151!important}
.glow-border{box-shadow:0 0 15px rgba(124,58,237,0.15)}
.glow-text{text-shadow:0 0 20px rgba(168,85,247,0.5)}
.clock-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.market-open{background-color:var(--success);box-shadow:0 0 8px rgba(16,185,129,0.6)}
.market-closed{background-color:var(--danger);box-shadow:0 0 8px rgba(239,68,68,0.4)}
.market-pre{background-color:var(--gold);box-shadow:0 0 8px rgba(245,158,11,0.4)}
.sub-tab-btn{background:rgba(124,58,237,0.08);color:#a78bfa;border:1px solid rgba(124,58,237,0.2);padding:5px 12px;border-radius:8px;font-size:10px;font-weight:700;cursor:pointer;transition:.2s}
.sub-tab-btn:hover{background:rgba(124,58,237,0.2);border-color:var(--accent)}
.sub-tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.logo-img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 3px rgba(255,255,255,0.1))}
.logo-container{display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%;flex-shrink:0}
canvas{display:block;image-rendering:auto}
.fade-in{animation:fadeIn .3s ease}@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.grid-card{background:linear-gradient(135deg,var(--panel),var(--panel2));border:1px solid rgba(124,58,237,0.1);border-radius:16px;padding:16px;transition:.3s}
.grid-card:hover{border-color:rgba(124,58,237,0.3);box-shadow:0 4px 20px rgba(124,58,237,0.08)}
.price-up{color:#10b981}.price-down{color:#ef4444}

// ===== EVENT DELEGATION =====
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-tab]');
  if(el){switchTab(el.dataset.tab);return;}
  el=e.target.closest('[data-ticker]');
  if(el){ticker=el.dataset.ticker;switchTab('symbol');return;}
  el=e.target.closest('[data-action]');
  if(el){
    var a=el.dataset.action,arg=el.dataset.arg;
    if(a==='search'){var v=document.getElementById('globalSearch');if(v&&v.value.trim()){ticker=v.value.toUpperCase().trim();switchTab('symbol');}}
    else if(a==='sub'){activeSub[el.dataset.key]=arg;render();}
    else if(a==='toggleBot'){botStates[arg]=!botStates[arg];render();}
    else if(a==='toggleOracle'){oracleStates[arg]=!oracleStates[arg];render();}
    else if(a==='toggleAllBots'){var on=arg==='on';for(var i=0;i<6;i++)botStates[i]=on;render();}
    else if(a==='toggleAllOracle'){var on=arg==='on';for(var i=0;i<10;i++)oracleStates[i]=on;render();}
    else if(a==='smartScan'){runSmartScan();}
    else if(a==='paperBuy'){var q=parseInt(document.getElementById('tQty')?document.getElementById('tQty').value:100)||100;var s=getSym(ticker);var cost=q*parseFloat(s.p);if(paperCash>=cost){paperCash-=cost;paperPos.push({sym:ticker,qty:q,price:s.p});render();}}
    else if(a==='paperSell'){var q=parseInt(document.getElementById('tQty')?document.getElementById('tQty').value:100)||100;paperCash+=q*parseFloat(getSym(ticker).p);paperPos.push({sym:ticker,qty:-q,price:getSym(ticker).p});render();}
    else if(a==='paperClose'){var i=parseInt(arg);if(paperPos[i]){paperCash+=paperPos[i].qty*parseFloat(getSym(paperPos[i].sym).p);paperPos.splice(i,1);render();}}
    else if(a==='addWatch'){var inp=document.getElementById('watchInput');if(inp&&inp.value.trim()){var t=inp.value.toUpperCase().trim();if(watchlist.indexOf(t)<0)watchlist.push(t);inp.value='';render();}}
    else if(a==='removeWatch'){watchlist=watchlist.filter(function(x){return x!==arg;});render();}
    else if(a==='psyAnswer'){psyAnswer(parseInt(arg));}
    else if(a==='psyNext'){psyState.q++;render();}
    else if(a==='psyReset'){psyState.q=0;psyState.answers=[];render();}
    else if(a==='calcStop'){calcStop();}
    else if(a==='calcFib'){calcFib();}
    else if(a==='refreshPage'){render();}
    else if(a==='executeTrade'){alert('Trade executed!');}
    else if(a==='backTab'){switchTab('home');}
    else if(a==='goTab'){if(arg)switchTab(arg);}
    else if(a==='alert'){alert(arg);}
  }
});

function pctC(c){return parseFloat(c)>=0?'price-up':'price-down'}
function pctA(c){return parseFloat(c)>=0?'\u25b2':'\u25bc'}

function stat(l,v,c,sub){return '<div class="bg-panel2 border border-gray-800/40 rounded-xl p-2 text-center hover:border-accent/20 transition"><div class="text-[8px] text-gray-500 uppercase font-bold tracking-wider">'+l+'</div><div class="text-sm font-black mt-0.5 '+(c||'text-white')+'">'+v+'</div>'+(sub?'<div class="text-[7px] text-gray-600 mt-0.5">'+sub+'</div>':'')+'</div>'}
function btn(label,action,arg,cls){return '<button class="btn '+(cls||'bg-accent text-white px-3 py-1.5 rounded-lg text-xs font-bold')+'" data-action="'+action+'"'+(arg?' data-arg="'+arg+'"':'')+'>'+label+'</button>'}
function showAlert(m){var a=document.createElement("div");a.className="fixed top-4 right-4 z-50 bg-accent text-white px-4 py-2 rounded-lg text-xs font-bold shadow-2xl animate-bounce";a.textContent=m;document.body.appendChild(a);setTimeout(function(){a.remove();},2000);}

function howto(title,steps){return card('How to Use: '+title,'<div class="text-[9px] text-gray-400 space-y-1">'+steps.map(function(s){return '<p>\u2022 '+s+'</p>';}).join('')+'</div>');}

function hdr(t,sub){return '<div class="flex items-center justify-between mb-3"><h1 class="text-xl font-black text-white">'+t+'</h1>'+(sub?'<span class="text-[9px] text-gray-500">'+sub+'</span>':'')+'</div>'}

// ===== CHART =====
function drawCandles(ctx,W,H,t){
  t=t||ticker;var s=getSym(t);
  var padR=62,padL=10,padT=28,padB=12;
  var volH=Math.floor(H*0.14),priceH=H-volH-padT-padB-10,chartW=W-padL-padR;
  var n=80,cw=chartW/n,base=parseFloat(s.p)||100,seed=0;
  for(var i=0;i<t.length;i++)seed+=t.charCodeAt(i);
  var rng=function(i){return(Math.abs(Math.sin(seed*9301+i*49297*0.0001))%1);};
  var candles=[];
  for(var i=0;i<n;i++){var ch=(rng(i)-0.45)*0.025;var o=base,cl=base*(1+ch);candles.push({o:o,c:cl,h:Math.max(o,cl)*(1+rng(i+100)*0.007),l:Math.min(o,cl)*(1-rng(i+200)*0.007),v:0.2+rng(i+300)*0.8});base=cl;}
  var aH=Math.max.apply(null,candles.map(function(c){return c.h})),aL=Math.min.apply(null,candles.map(function(c){return c.l})),pr=aH-aL||1;
  var mxV=Math.max.apply(null,candles.map(function(c){return c.v}));
  var yP=function(p){return padT+priceH-((p-aL)/pr)*priceH;};
  ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(55,55,80,0.2)';ctx.lineWidth=0.5;ctx.font='10px monospace';ctx.textAlign='right';

  var volY=padT+priceH+8;
  // EMAs

function drawLine(ctx,W,H){
  var pts=[],seed=42;for(var i=0;i<60;i++)pts.push(0.15+Math.abs(Math.sin(seed+i*0.32))%1*0.7);
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),r=mx-mn||1;
  ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(55,55,80,0.15)';ctx.lineWidth=0.5;for(var i=0;i<5;i++){var y=12+((H-24)*i/4);ctx.beginPath();ctx.moveTo(6,y);ctx.lineTo(W-6,y);ctx.stroke();}
  var grad=ctx.createLinearGradient(0,12,0,H-12);grad.addColorStop(0,'rgba(124,58,237,0.2)');grad.addColorStop(1,'rgba(124,58,237,0)');
  ctx.fillStyle=grad;ctx.beginPath();pts.forEach(function(p,i){var x=6+((W-12)*i/59),y=12+(H-24)-((p-mn)/r)*(H-24);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.lineTo(W-6,H-12);ctx.lineTo(6,H-12);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#7c3aed';ctx.lineWidth=2.5;ctx.beginPath();pts.forEach(function(p,i){var x=6+((W-12)*i/59),y=12+(H-24)-((p-mn)/r)*(H-24);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  var lx=6+((W-12)*59/59),ly=12+(H-24)-((pts[59]-mn)/r)*(H-24);ctx.fillStyle='#7c3aed';ctx.beginPath();ctx.arc(lx,ly,5,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(lx,ly,2.5,0,Math.PI*2);ctx.fill();
}

function drawGauge(ctx,W,H,v,label){
  var cx=W/2,cy=H*0.82,r=Math.min(W/2-10,H*0.55);
  ctx.beginPath();ctx.arc(cx,cy,r,Math.PI,2*Math.PI);ctx.strokeStyle='#1e222d';ctx.lineWidth=12;ctx.stroke();
  [[0,.25,'#ef4444'],[.25,.45,'#f59e0b'],[.45,.55,'#4b5563'],[.55,.75,'#10b981'],[.75,1,'#3b82f6']].forEach(function(z){ctx.beginPath();ctx.arc(cx,cy,r,Math.PI+z[0]*Math.PI,Math.PI+z[1]*Math.PI);ctx.strokeStyle=z[2];ctx.lineWidth=12;ctx.stroke();});
  var na=Math.PI+(v/100)*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(na)*r*0.76,cy+Math.sin(na)*r*0.76);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 24px sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(v),cx,cy-14);
  if(label){ctx.font='11px sans-serif';ctx.fillStyle='#9ca3af';ctx.fillText(label,cx,cy+18);}ctx.textAlign='left';
}

function drawBar(ctx,W,H,data){
  ctx.fillStyle='#0a0a14';ctx.fillRect(0,0,W,H);
  var max=Math.max.apply(null,data.map(function(d){return Math.abs(d.v);}));var bw=W/data.length*0.7;
  data.forEach(function(d,i){var bh=Math.abs(d.v)/max*(H-24);var x=i*(W/data.length)+5;var y=d.v>=0?H-12-bh:H-12;
  ctx.fillStyle=d.c||'#7c3aed';ctx.fillRect(x,y,bw,bh);ctx.fillStyle='#6b7280';ctx.font='9px monospace';ctx.textAlign='center';ctx.fillText(d.l,x+bw/2,H-3);});
}

function afterRender(){
  document.querySelectorAll('canvas[data-c]').forEach(function(cv){
    var dpr=window.devicePixelRatio||1;var rect=cv.getBoundingClientRect();
    if(rect.width<2||rect.height<2)return;
    cv.width=Math.round(rect.width*dpr);cv.height=Math.round(rect.height*dpr);
    var ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);
    var t=cv.getAttribute('data-c');
    if(t==='candles')drawCandles(ctx,rect.width,rect.height,cv.getAttribute('data-t'));
    else if(t==='line')drawLine(ctx,rect.width,rect.height);
    else if(t==='gauge')drawGauge(ctx,rect.width,rect.height,parseFloat(cv.getAttribute('data-v')),cv.getAttribute('data-l'));
    else if(t==='bar'){var data=JSON.parse(cv.getAttribute('data-bar')||'[]');drawBar(ctx,rect.width,rect.height,data);}
  });
}
