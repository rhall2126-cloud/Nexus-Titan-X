function getSym(t){
  t=(t||'TSLA').toUpperCase().trim();
  if(SYMBOLS[t])return Object.assign({t:t},SYMBOLS[t]);
  var hash=0;for(var i=0;i<t.length;i++)hash=(hash*31+t.charCodeAt(i))%100000;
  var base=20+hash%400;var ch=((hash%2000)/100-10);
  return{t:t,n:t+' Inc.',p:base.toFixed(2),c:ch.toFixed(2),vol:(hash%90+10)+'M',mcap:(hash%900+50)+'B',pe:(hash%80+5).toFixed(1),float:(hash%5+0.5).toFixed(1)+'B',si:((hash%25)/10).toFixed(1),atr:(hash%10+0.5).toFixed(1),rsi:hash%100,sector:'Other'};

function updateMarketClock(){
  var now=new Date();
  var et=new Date(now.toLocaleString('en-US',{timeZone:'America/New_York'}));
  var h=et.getHours(),m=et.getMinutes(),s=et.getSeconds();
  var ampm=h>=12?'PM':'AM';var hr=h%12||12;
  var tStr=hr+':'+(m<10?'0':'')+m+':'+(s<10?'0':'')+s+' '+ampm+' ET';
  var dc=document.getElementById('currDate');
  if(dc)dc.innerHTML=et.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  var mc=document.getElementById('marketClock');
  if(mc)mc.innerHTML=tStr;
  // Market countdown
  var day=et.getDay();
  var isWeekend=day===0||day===6;
  var totalSec=h*3600+m*60+s;
  var pmOpen=totalSec>=23400&&totalSec<57600;
  var cd=document.getElementById('marketCountdown');
  if(cd){
    if(pmOpen){
      cd.innerHTML='<span class="text-success">● MARKET OPEN</span> <span class="text-gray-500">Closes 4:00PM</span>';
    }else if(isWeekend){
      cd.innerHTML='<span class="text-gray-500">Closed · Opens Monday 9:30AM</span>';
    }else{
      var openSec=9.5*3600;var remain=openSec-totalSec;
      if(remain<0)remain+=86400;
      var rh=Math.floor(remain/3600),rm=Math.floor((remain%3600)/60),rs=remain%60;
      if(totalSec>=4*3600&&totalSec<9.5*3600){
        cd.innerHTML='<span class="text-gold">● PRE-MARKET</span> <span class="text-gray-500">'+rh+'h '+rm+'m to open</span>';
      }else if(totalSec>=57600&&totalSec<20*3600){
        cd.innerHTML='<span class="text-gray-400">● AFTER HOURS</span> <span class="text-gray-600">'+rh+'h '+rm+'m to pre</span>';
      }else{
        cd.innerHTML='<span class="text-danger">● CLOSED</span> <span class="text-gray-500">'+rh+'h '+rm+'m to pre-market</span>';
      }
    }
  }
}

function afterRender(){
  initChartDrawing();
  // Hi-DPI canvas setup + draw
  document.querySelectorAll('canvas[data-chart]').forEach(function(cv){
    setupCanvas(cv);
    var type=cv.getAttribute('data-chart');
    drawChart(cv,type);
  });
  // Gauges
  document.querySelectorAll('canvas[data-gauge]').forEach(function(cv){
    setupCanvas(cv);
    drawGauge(cv,parseFloat(cv.getAttribute('data-val')),cv.getAttribute('data-label')||'',cv.getAttribute('data-max')||100);
  });
}

function setupCanvas(cv){
  var dpr=window.devicePixelRatio||1;
  var rect=cv.getBoundingClientRect();
  cv.width=Math.max(1,rect.width*dpr);
  cv.height=Math.max(1,rect.height*dpr);
  var ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr);
}

function drawChart(cv,type){
  var ctx=cv.getContext('2d');
  var rect=cv.getBoundingClientRect();
  var W=rect.width,H=rect.height;
  ctx.clearRect(0,0,W,H);
  if(type==='candles')drawCandles(ctx,W,H);
  else if(type==='line')drawLine(ctx,W,H);
  else if(type==='altseason')drawAltSeason(ctx,W,H);
  else if(type==='bars')drawBars(ctx,W,H);
  else if(type==='donut')drawDonut(ctx,W,H);
  else if(type==='waterfall')drawWaterfall(ctx,W,H);
}

function drawCandles(ctx,W,H,ticker){
  var t=ticker||globalTicker;
  var s=getSym(t);
  var volH=Math.floor(H*0.18);
  var priceH=H-volH-30;
  var padR=55,padL=6,padT=14;
  var chartW=W-padL-padR;
  var n=60,cw=chartW/n;
  var base=parseFloat(s.p)||100;
  var seed=0;for(var i=0;i<t.length;i++)seed+=t.charCodeAt(i);
  var rng=function(i){var x=Math.sin(seed*9301+i*49297)*233280;return x-Math.floor(x);};
  var candles=[];
  for(var i=0;i<n;i++){
    var change=(rng(i)-0.45)*0.025;
    var o=base;var cl=base*(1+change);
    var range=Math.abs(cl-o)/Math.max(o,0.01);
    var hi=Math.max(o,cl)*(1+rng(i+100)*0.004+range*0.5);
    var lo=Math.min(o,cl)*(1-rng(i+200)*0.004-range*0.5);
    var vol=0.3+rng(i+300)*0.7;
    candles.push({o:o,c:cl,h:hi,l:lo,v:vol});base=cl;
  }
  var allHi=Math.max.apply(null,candles.map(function(c){return c.h;}));
  var allLo=Math.min.apply(null,candles.map(function(c){return c.l;}));
  var prange=allHi-allLo||1;
  var maxVol=Math.max.apply(null,candles.map(function(c){return c.v;}));

  // Background
  ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);

  // Grid + price labels
  ctx.strokeStyle='rgba(55,55,70,0.5)';ctx.lineWidth=0.5;
  ctx.font='9px monospace';ctx.textAlign='right';
  var yPx=function(price){return padT+priceH-((price-allLo)/prange)*priceH;};
  for(var i=0;i<=5;i++){
    var price=allLo+(prange*i/5);
    var y=yPx(price);
    ctx.beginPath();ctx.moveTo(padL,y);ctx.lineTo(padL+chartW,y);ctx.stroke();
    ctx.fillStyle='#6b7280';ctx.fillText(price.toFixed(2),W-3,y+3);
  }
  // Volume separator line
  var volY=H-volH-12;
  ctx.strokeStyle='rgba(55,55,70,0.8)';ctx.lineWidth=0.5;
  ctx.beginPath();ctx.moveTo(padL,volY);ctx.lineTo(padL+chartW,volY);ctx.stroke();

  // EMA calculations
  var ema20=[],ema50=[];
  var e20=base,e50=base;
  for(var i=0;i<n;i++){var p=candles[i].c;e20=p*0.095+e20*0.905;e50=p*0.039+e50*0.961;ema20.push(e20);ema50.push(e50);}

  // VWAP
  var vwap=[],cumPV=0,cumV=0;
  for(var i=0;i<n;i++){var tp=(candles[i].h+candles[i].l+candles[i].c)/3;cumPV+=tp*candles[i].v;cumV+=candles[i].v;vwap.push(cumPV/cumV);}

  // EMA lines
  function drawLine(arr,color,lw){
    ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.beginPath();
    arr.forEach(function(v,i){var x=padL+i*cw+cw/2;var y=yPx(v);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
    ctx.stroke();
  }
  drawLine(ema20,'#8b5cf6',1.5);
  drawLine(ema50,'#3b82f6',1.5);
  drawLine(vwap,'rgba(245,158,11,0.7)',1);

  // Candles
  candles.forEach(function(c,i){
    var x=padL+i*cw+1,w=cw-2;
    var bull=c.c>=c.o;
    var col=bull?'#10b981':'#ef4444';
    var yO=yPx(c.o),yC=yPx(c.c),yH=yPx(c.h),yL=yPx(c.l);
    // Wick
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x+w/2,yH);ctx.lineTo(x+w/2,yL);ctx.stroke();
    // Body
    ctx.fillStyle=col;
    var top=Math.min(yO,yC),ht=Math.max(Math.abs(yC-yO),1);
    ctx.fillRect(x,top,w,ht);
    // Volume bar
    var vh=(c.v/maxVol)*volH;
    ctx.globalAlpha=0.5;ctx.fillRect(x,volY+volH-vh+8,Math.max(w-1,1),vh);ctx.globalAlpha=1;
  });

  // Current price line
  var lastPrice=candles[n-1].c;
  var lastY=yPx(lastPrice);
  ctx.strokeStyle='rgba(139,92,246,0.6)';ctx.lineWidth=0.8;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(padL,lastY);ctx.lineTo(padL+chartW,lastY);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='#8b5cf6';ctx.fillRect(padL+chartW,lastY-8,padR,16);
  ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='center';
  ctx.fillText(lastPrice.toFixed(2),padL+chartW+padR/2,lastY+3);

  // Labels
  ctx.textAlign='left';ctx.font='bold 10px sans-serif';ctx.fillStyle='#8b5cf6';
  ctx.fillText(t+' · $'+s.p+'  '+(s.c>=0?'+':'')+s.c+'%',padL+2,padT-4);
  // Legend
  ctx.font='8px sans-serif';
  ctx.fillStyle='#8b5cf6';ctx.fillText('EMA20',padL+120,padT-4);
  ctx.fillStyle='#3b82f6';ctx.fillText('EMA50',padL+165,padT-4);
  ctx.fillStyle='rgba(245,158,11,0.9)';ctx.fillText('VWAP',padL+210,padT-4);
  // Volume label
  ctx.fillStyle='#6b7280';ctx.font='8px monospace';ctx.textAlign='right';
  ctx.fillText('VOL',padL+chartW-3,volY+10);

  // Draw overlays
  if(window._drawings&&window._drawings.length){
    window._drawings.forEach(function(d){
      ctx.strokeStyle=d.color||'#f59e0b';ctx.lineWidth=1.5;
      if(d.type==='trend'||d.type==='ray'){
        ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();
        if(d.type==='ray'){var dx=d.x2-d.x1,dy=d.y2-d.y1;ctx.beginPath();ctx.moveTo(d.x2,d.y2);ctx.lineTo(d.x2+dx*3,d.y2+dy*3);ctx.stroke();}
      }
      else if(d.type==='hline'){ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(0,d.y1);ctx.lineTo(W,d.y1);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=d.color;ctx.font='8px monospace';ctx.fillText('$',2,d.y1-2);}
      else if(d.type==='vline'){ctx.setLineDash([5,3]);ctx.strokeStyle='#3b82f6';ctx.beginPath();ctx.moveTo(d.x1,0);ctx.lineTo(d.x1,H);ctx.stroke();ctx.setLineDash([]);}
      else if(d.type==='box'){ctx.strokeRect(Math.min(d.x1,d.x2),Math.min(d.y1,d.y2),Math.abs(d.x2-d.x1),Math.abs(d.y2-d.y1));ctx.fillStyle='rgba(139,92,246,0.05)';ctx.fillRect(Math.min(d.x1,d.x2),Math.min(d.y1,d.y2),Math.abs(d.x2-d.x1),Math.abs(d.y2-d.y1));}
      else if(d.type==='parallel'){ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();var off=(d.y2-d.y1)*0.3+20;ctx.beginPath();ctx.moveTo(d.x1,d.y1+off);ctx.lineTo(d.x2,d.y2+off);ctx.stroke();}
      else if(d.type==='measure'){ctx.setLineDash([4,2]);ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#10b981';ctx.font='bold 10px monospace';ctx.fillText('$'+Math.abs(d.y2-d.y1).toFixed(0),d.x2+5,d.y2-5);}
      else if(d.type==='fib'||d.type==='fibext'){var levels=d.type==='fib'?[0,0.236,0.382,0.5,0.618,0.786,1]:[1.272,1.618,2.618];var dy=d.y2-d.y1;levels.forEach(function(lvl){var ly=d.y1+dy*lvl;ctx.strokeStyle='rgba(245,158,11,0.4)';ctx.setLineDash([3,2]);ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f59e0b';ctx.font='8px monospace';ctx.fillText((lvl*100).toFixed(1)+'%',4,ly-2);});}
      else if(d.type==='brush'&&d.points){ctx.strokeStyle=d.color;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(d.points[0].x,d.points[0].y);for(var pi=1;pi<d.points.length;pi++){ctx.lineTo(d.points[pi].x,d.points[pi].y);}ctx.stroke();}
      else if(d.type==='text'){ctx.fillStyle=d.color||'#fff';ctx.font='bold 11px sans-serif';ctx.fillText(d.text,d.x1,d.y1);}
      else if(d.type==='arrow'){ctx.strokeStyle=d.color;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();var ang=Math.atan2(d.y2-d.y1,d.x2-d.x1);ctx.beginPath();ctx.moveTo(d.x2,d.y2);ctx.lineTo(d.x2-10*Math.cos(ang-0.4),d.y2-10*Math.sin(ang-0.4));ctx.moveTo(d.x2,d.y2);ctx.lineTo(d.x2-10*Math.cos(ang+0.4),d.y2-10*Math.sin(ang+0.4));ctx.stroke();}
      else if(d.type==='pitchfork'){ctx.strokeStyle='#06b6d4';ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x2,d.y2);ctx.stroke();}
      else if(d.type==='gann'){ctx.strokeStyle='rgba(245,158,11,0.5)';for(var ga=0;ga<8;ga++){var gang=(ga/8)*Math.PI;ctx.beginPath();ctx.moveTo(d.x1,d.y1);ctx.lineTo(d.x1+Math.cos(gang)*200,d.y1+Math.sin(gang)*200);ctx.stroke();}}
    });
  }
}

function drawLine(ctx,W,H){
  var s=getSym(globalTicker);
  var seed=0;for(var i=0;i<globalTicker.length;i++)seed+=globalTicker.charCodeAt(i);
  var rng=function(i){var x=Math.sin(seed+i*37)*10000;return x-Math.floor(x);};
  var n=50,pts=[],base=parseFloat(s.p)||100;
  for(var i=0;i<n;i++){base*=(1+(rng(i)-0.45)*0.02);pts.push(base);}
  var min=Math.min.apply(null,pts),max=Math.max.apply(null,pts),range=max-min||1;
  var grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,'rgba(139,92,246,0.3)');grad.addColorStop(1,'rgba(139,92,246,0)');
  ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(55,55,70,0.4)';ctx.lineWidth=0.5;
  for(var i=0;i<5;i++){var y=(H-10)*(i/4)+5;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  // Fill
  ctx.beginPath();pts.forEach(function(p,i){var x=(i/(n-1))*W;var y=H-10-((p-min)/range)*(H-20);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
  // Line
  ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2;ctx.beginPath();
  pts.forEach(function(p,i){var x=(i/(n-1))*W;var y=H-10-((p-min)/range)*(H-20);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();
  // Last point dot
  var lx=W,ly=H-10-((pts[n-1]-min)/range)*(H-20);
  ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.arc(lx-2,ly,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 9px monospace';ctx.textAlign='right';
  ctx.fillText(pts[n-1].toFixed(2),W-5,ly-6);
  ctx.textAlign='left';
}

function drawAltSeason(ctx,W,H){
  ctx.clearRect(0,0,W,H);
  var pts1=[],pts2=[];
  var seed=42;var rng=function(i){return((Math.sin(seed+i*7)*100)%1+1)%1;};
  for(var i=0;i<30;i++){pts1.push(40+rng(i)*30+rng(i+99)*15);pts2.push(55+rng(i+50)*25);}
  ctx.strokeStyle='#374151';ctx.lineWidth=1;
  for(var i=0;i<5;i++){var y=(H-20)*(i/4)+10;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(W-5,y);ctx.stroke();}
  ctx.fillStyle='#f59e0b';ctx.font='8px monospace';ctx.fillText('BTC',2,14);
  ctx.fillStyle='#8b5cf6';ctx.fillText('ALT',2,26);
  ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.beginPath();
  pts1.forEach(function(p,i){var x=30+(i/29)*(W-35);var y=H-10-((p)/100)*(H-20);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();
  ctx.strokeStyle='#8b5cf6';ctx.beginPath();
  pts2.forEach(function(p,i){var x=30+(i/29)*(W-35);var y=H-10-((p)/100)*(H-20);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
  ctx.stroke();
}

function drawBars(ctx,W,H){
  var data=[30,55,42,68,40,25,50];
  var colors=['#10b981','#ef4444','#8b5cf6','#f59e0b','#10b981','#ef4444','#8b5cf6'];
  var bw=W/data.length*0.7;
  data.forEach(function(d,i){
    var bh=(d/70)*(H-20);
    ctx.fillStyle=colors[i];
    ctx.fillRect(i*(W/data.length)+5,H-10-bh,bw,bh);
  });
}

function drawDonut(ctx,W,H){
  var data=[{v:52,c:'#10b981'},{v:22,c:'#8b5cf6'},{v:11,c:'#f59e0b'},{v:8,c:'#3b82f6'},{v:7,c:'#ef4444'}];
  var cx=W/2,cy=H/2,r=Math.min(W,H)/2-10,start=-Math.PI/2;
  data.forEach(function(d){
    var ang=(d.v/100)*Math.PI*2;
    ctx.beginPath();ctx.arc(cx,cy,r,start,start+ang);ctx.strokeStyle=d.c;ctx.lineWidth=18;ctx.stroke();
    start+=ang;
  });
}

function drawWaterfall(ctx,W,H){
  var data=[100,-35,65,-20,45,-12,33];
  var labels=['Rev','COGS','GP','OpEx','OI','Tax','NI'];
  var colors=['#10b981','#ef4444','#10b981','#ef4444','#10b981','#ef4444','#10b981'];
  var bw=W/data.length*0.7;
  var cum=0;
  data.forEach(function(d,i){
    var bh=(Math.abs(d)/100)*(H-30);
    var y=d>0?H-20-bh-cum/100*(H-30):H-20-cum/100*(H-30)-bh;
    ctx.fillStyle=colors[i];
    ctx.fillRect(i*(W/data.length)+5,y,bw,bh);
    cum+=d;
  });
}

function drawGauge(cv,val,label,max){
  var ctx=cv.getContext('2d');
  var rect=cv.getBoundingClientRect();
  var cx=rect.width/2,cy=rect.height*0.85,r=Math.min(rect.width/2,rect.height*0.7)-8;
  var startAng=Math.PI,endAng=2*Math.PI;
  var zones=[
    {from:0,to:0.25,color:'#ef4444'},{from:0.25,to:0.45,color:'#f59e0b'},
    {from:0.45,to:0.55,color:'#6b7280'},{from:0.55,to:0.75,color:'#10b981'},
    {from:0.75,to:1,color:'#3b82f6'}
  ];
  zones.forEach(function(z){
    ctx.beginPath();ctx.arc(cx,cy,r,Math.PI+z.from*Math.PI,Math.PI+z.to*Math.PI);
    ctx.strokeStyle=z.color;ctx.lineWidth=14;ctx.lineCap='butt';ctx.stroke();
  });
  var valNorm=val/(max||100);
  var needleAng=Math.PI+valNorm*Math.PI;
  ctx.beginPath();ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(needleAng)*r*0.85,cy+Math.sin(needleAng)*r*0.85);
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
  ctx.fillStyle='#fff';ctx.font='bold 20px Inter,sans-serif';ctx.textAlign='center';
  ctx.fillText(Math.round(val),cx,cy-8);
  if(label){ctx.font='9px sans-serif';ctx.fillStyle='#9ca3af';ctx.fillText(label,cx,cy+12);}
  ctx.textAlign='left';
}

// Pro Charts functions
function togglePCIndicator(name){
  window._pcIndicators[name]=!window._pcIndicators[name];
  render();
}
function setPCTool(tool){
  window._pcTool=tool;
  var cv=document.getElementById('pcCanvas');
  if(cv){cv.style.cursor=(tool==='cursor')?'default':(tool==='brush'?'crosshair':'crosshair');}
  render();
}
function setPCTimeframe(tf){window._pcTF=tf;render();}
function setPCChartType(type){window._pcChartType=type;render();}
function clearDrawings(){window._drawings=[];render();}
function undoDrawing(){if(window._drawings&&window._drawings.length){window._drawings.pop();render();}}
function toggleFullscreen(){
  var cv=document.getElementById('pcCanvas');
  if(cv&&cv.parentElement){if(!document.fullscreenElement){cv.parentElement.requestFullscreen&&cv.parentElement.requestFullscreen();}else{document.exitFullscreen&&document.exitFullscreen();}}
}
function screenshotChart(){
  var cv=document.getElementById('pcCanvas');
  if(cv){try{var link=document.createElement('a');link.download=globalTicker+'_chart.png';link.href=cv.toDataURL();link.click();}catch(e){alert('Chart screenshot saved!');}}
}

// Chart drawing interaction - fully interactive
function initChartDrawing(){
  var cv=document.getElementById('pcCanvas');
  if(!cv)return;
  var isDrawing=false,startX=0,startY=0;
  var brushPoints=[];
  cv.onmousedown=function(e){
    var tool=window._pcTool||'cursor';
    if(tool==='cursor'||tool==='crosshair'||tool==='magnet'||tool==='zoom'||tool==='eraser')return;
    var r=cv.getBoundingClientRect();
    startX=e.clientX-r.left;startY=e.clientY-r.top;
    isDrawing=true;
    if(tool==='brush')brushPoints=[{x:startX,y:startY}];
  };
  cv.onmousemove=function(e){
    if(!isDrawing)return;
    var r=cv.getBoundingClientRect();
    var x=e.clientX-r.left,y=e.clientY-r.top;
    var tool=window._pcTool;
    if(tool==='brush'){brushPoints.push({x:x,y:y});}
    // Redraw base chart
    setupCanvas(cv);
    var type=cv.getAttribute('data-chart');
    drawChart(cv,type);
    // Draw preview
    var ctx=cv.getContext('2d');
    ctx.lineWidth=1.5;
    if(tool==='trend'||tool==='ray'){ctx.strokeStyle='#f59e0b';ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();if(tool==='ray'){var dx=x-startX,dy=y-startY;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+dx*2,y+dy*2);ctx.stroke();}}
    else if(tool==='hline'){ctx.strokeStyle='#ef4444';ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(0,startY);ctx.lineTo(cv.getBoundingClientRect().width,startY);ctx.stroke();ctx.setLineDash([]);}
    else if(tool==='vline'){ctx.strokeStyle='#3b82f6';ctx.setLineDash([5,3]);ctx.beginPath();ctx.moveTo(startX,0);ctx.lineTo(startX,cv.getBoundingClientRect().height);ctx.stroke();ctx.setLineDash([]);}
    else if(tool==='parallel'){ctx.strokeStyle='#10b981';ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();ctx.beginPath();ctx.moveTo(startX,y-startY+ (y-(y-startY)*0.5+20));ctx.lineTo(x,y-startY+(y-(y-startY)*0.5+20));ctx.stroke();}
    else if(tool==='box'){ctx.strokeStyle='#8b5cf6';ctx.strokeRect(Math.min(startX,x),Math.min(startY,y),Math.abs(x-startX),Math.abs(y-startY));}
    else if(tool==='fib'||tool==='fibext'){ctx.strokeStyle='#f59e0b';var levels=tool==='fib'?[-0.236,0,0.236,0.382,0.5,0.618,0.786,1]:[1.272,1.618,2.618];var dy=y-startY;levels.forEach(function(lvl){var ly=startY+dy*lvl*(tool==='fib'?(1-lvl):1);ctx.strokeStyle='rgba(245,158,11,0.5)';ctx.setLineDash([3,2]);ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(cv.getBoundingClientRect().width,ly);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#f59e0b';ctx.font='8px monospace';ctx.fillText((lvl*100).toFixed(1)+'%',4,ly-2);});}
    else if(tool==='pitchfork'){ctx.strokeStyle='#06b6d4';ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();var mx=(startX+x)/2,my=(startY+y)/2;ctx.beginPath();ctx.moveTo(mx,my);ctx.lineTo(mx+(x-mx),my+(y-my));ctx.stroke();}
    else if(tool==='gann'){ctx.strokeStyle='rgba(245,158,11,0.6)';for(var a=0;a<8;a++){var ang=(a/8)*Math.PI;ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(startX+Math.cos(ang)*200,startY+Math.sin(ang)*200);ctx.stroke();}}
    else if(tool==='measure'){ctx.strokeStyle='#10b981';ctx.setLineDash([4,2]);ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();ctx.setLineDash([]);var d=Math.abs(y-startY).toFixed(0);ctx.fillStyle='#10b981';ctx.font='bold 11px monospace';ctx.fillText('$'+d,x+5,y-5);}
    else if(tool==='brush'&&brushPoints.length>1){ctx.strokeStyle='#ec4899';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(brushPoints[0].x,brushPoints[0].y);for(var i=1;i<brushPoints.length;i++){ctx.lineTo(brushPoints[i].x,brushPoints[i].y);}ctx.stroke();}
    else if(tool==='arrow'){ctx.strokeStyle='#f59e0b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(startX,startY);ctx.lineTo(x,y);ctx.stroke();var ang=Math.atan2(y-startY,x-startX);ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-10*Math.cos(ang-0.4),y-10*Math.sin(ang-0.4));ctx.moveTo(x,y);ctx.lineTo(x-10*Math.cos(ang+0.4),y-10*Math.sin(ang+0.4));ctx.stroke();}
  };
  cv.onmouseup=function(e){
    if(!isDrawing)return;
    isDrawing=false;
    var r=cv.getBoundingClientRect();
    var x=e.clientX-r.left,y=e.clientY-r.top;
    var tool=window._pcTool;
    if(tool==='cursor'||tool==='crosshair'||tool==='magnet'||tool==='zoom')return;
    var color='#f59e0b';
    if(tool==='hline')color='#ef4444';
    else if(tool==='vline')color='#3b82f6';
    else if(tool==='box')color='#8b5cf6';
    else if(tool==='parallel')color='#10b981';
    else if(tool==='brush')color='#ec4899';
    else if(tool==='arrow')color='#f59e0b';
    if(tool==='text'){
      var txt=prompt('Enter annotation text:');
      if(txt)window._drawings.push({type:'text',x1:x,y1:y,text:txt,color:'#fff'});
    }else if(tool==='brush'){
      window._drawings.push({type:'brush',points:brushPoints.slice(),color:color});
    }else{
      window._drawings.push({type:tool,x1:startX,y1:startY,x2:x,y2:y,color:color});
    }
    setupCanvas(cv);
    var type=cv.getAttribute('data-chart');
    drawChart(cv,type);
  };
}

function paperBuy(){var sym=document.getElementById('paperSym').value.toUpperCase();var q=parseInt(document.getElementById('paperQty').value)||0;var s=getSym(sym);var cost=q*s.p;if(q>0&&paperCash>=cost){paperCash-=cost;paperPositions.push({sym:sym,qty:q,price:s.p});render();}}
function paperSell(){var sym=document.getElementById('paperSym').value.toUpperCase();var q=parseInt(document.getElementById('paperQty').value)||0;var s=getSym(sym);if(q>0){paperCash+=q*s.p;paperPositions.push({sym:sym,qty:-q,price:s.p});render();}}

function calcStop(){
  var entry=parseFloat(document.getElementById('ssEntry').value)||100;
  var type=document.getElementById('ssType').value;
  var s=getSym(globalTicker);
  var atr=parseFloat(s.atr)||5;
  var stop=entry;
  if(type.indexOf('1.5')>=0)stop=entry-atr*1.5;
  else if(type.indexOf('2')>=0)stop=entry-atr*2;
  else if(type==='VWAP')stop=entry*0.98;
  else if(type==='Fixed %')stop=entry*0.97;
  else if(type==='Swing Low')stop=entry*0.95;
  var risk=entry-stop;
  var target=entry+risk*3;
  document.getElementById('ssResult').innerHTML='<div class="bg-accent/5 border border-accent/10 rounded-lg p-2 space-y-1"><div>🛑 Stop: <span class="text-danger font-bold">$'+stop.toFixed(2)+'</span></div><div>💰 Risk: <span class="text-white">$'+risk.toFixed(2)+'/share</span></div><div>🏆 Target (3R): <span class="text-success font-bold">$'+target.toFixed(2)+'</span></div><div>📊 R:R: <span class="text-accent font-bold">3:1</span></div></div>';
}

RENDERERS.correlation=function(){
  var assets=['SPY','QQQ','IWM','TLT','GLD','BTC'];
  function color(v){return v>0.7?'bg-success/60':v>0.3?'bg-success/30':v>-0.3?'bg-gray-700':v>-0.7?'bg-danger/30':'bg-danger/60';}
  function val(i,j){if(i===j)return 1;var d=Math.abs(i-j);return(0.9-d*0.15).toFixed(2);}
  var matrix='<table class="w-full text-xs text-center"><thead><tr><th></th>'+assets.map(function(a){return '<th class="p-1 text-[9px] text-gray-500">'+a+'</th>';}).join('')+'</tr></thead><tbody>';
  assets.forEach(function(a,i){matrix+='<tr><td class="p-1 text-[9px] font-bold text-gray-400">'+a+'</td>';assets.forEach(function(b,j){var v=val(i,j);matrix+='<td class="p-1"><div class="'+color(parseFloat(v))+' rounded py-1 font-mono text-[10px] font-bold text-white">'+v+'</div></td>';});matrix+='</tr>';});
  matrix+='</tbody></table>';
  return '<div class="space-y-3">'+backBtn()+
    '<h1 class="text-xl font-black text-white mb-2"><i class="fa-solid fa-link text-accent"></i> Correlation Matrix</h1>'+
    '<div class="grid grid-cols-1 lg:grid-cols-2 gap-3">'+
      card('6x6 CORRELATION MATRIX',matrix)+
      card('HOW TO USE','<div class="text-xs text-gray-300 space-y-2"><p><span class="text-accent font-bold">Step 1:</span> Identify highly correlated assets (>0.7). These move together.</p><p><span class="text-accent font-bold">Step 2:</span> Avoid holding multiple high-correlation positions — you\'re not diversified, you\'re leveraged.</p><p><span class="text-accent font-bold">Step 3:</span> Look for negative correlations for hedging (e.g., TLT vs SPY).</p><p><span class="text-gold font-bold">💡 PRO TIP:</span> BTC has low correlation to stocks — adding 5-10% can improve risk-adjusted returns.</p></div>')+
    '</div>'+
  '</div>';
};

function testApiKey(platform){
  var inputId='apikey-'+platform.replace(/[^a-zA-Z0-9]/g,'');
  var el=document.getElementById(inputId);
  var key=el?el.value.trim():'';
  if(!key&&platform!=='Yahoo Finance'&&platform!=='CoinGecko'){
    if(!window._apiConnected[platform]){alert('Please enter an API key first');return;}
  }
  window._apiKeys[platform]=key;
  // Simulate connection test
  if(!window._apiConnected)window._apiConnected={};
  window._apiConnected[platform]=true;
  var msg=platform+' connected successfully! ✓\n\nStatus: '+Object.keys(window._apiConnected).filter(function(k){return window._apiConnected[k];}).length+' platforms connected.';
  render();
  // Show toast
  var t=document.createElement('div');
  t.style.cssText='position:fixed;top:60px;right:20px;z-index:9999;background:#10b981;color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:bold;box-shadow:0 4px 12px rgba(16,185,129,0.4);animation:fadeIn 0.3s ease';
  t.innerHTML='<i class="fa-solid fa-check-circle"></i> '+platform+' Connected!';
  document.body.appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='opacity 0.5s';setTimeout(function(){t.remove();},500);},3000);
}
function addCustomPlatform(){
  var el=document.getElementById('customPlatform');
  var name=el?el.value.trim():'';
  if(!name){alert('Enter platform name');return;}
  if(!window._customPlatforms)window._customPlatforms=[];
  window._customPlatforms.push(name);
  el.value='';
  render();

}
function calcFib(){
  var h=parseFloat(document.getElementById('fibHigh').value)||180;
  var l=parseFloat(document.getElementById('fibLow').value)||100;
  var c=parseFloat(document.getElementById('fibClose').value)||150;
  var diff=h-l;
  var fibs=[['100% (High)',h],['61.8% Golden',l+diff*0.618],['50% Median',l+diff*0.5],['38.2% Pullback',l+diff*0.382],['23.6% Shallow',l+diff*0.236],['0% (Low)',l]];
  var pp=(h+l+c)/3,r1=2*pp-l,s1=2*pp-h;
  var el=document.getElementById('fibResult');
  if(el)el.innerHTML=card('CALCULATED LEVELS','<div class="space-y-3"><div><div class="text-[9px] text-gray-500 uppercase font-bold mb-1">📏 Fibonacci Retracement</div>'+fibs.map(function(f){return '<div class="flex justify-between text-xs py-1 border-b border-gray-800/50"><span class="text-gray-400">'+f[0]+'</span><span class="text-white font-mono font-bold">$'+f[1].toFixed(2)+'</span></div>';}).join('')+'</div><div><div class="text-[9px] text-gray-500 uppercase font-bold mb-1 mt-2">🎯 Classic Pivots</div><div class="flex justify-between text-xs py-1"><span class="text-danger">R1</span><span class="font-mono">$'+r1.toFixed(2)+'</span></div><div class="flex justify-between text-xs py-1"><span class="text-accent font-bold">PP</span><span class="font-mono font-bold">$'+pp.toFixed(2)+'</span></div><div class="flex justify-between text-xs py-1"><span class="text-success">S1</span><span class="font-mono">$'+s1.toFixed(2)+'</span></div></div></div>');
}

function psyAnswer(i){
  var st=window._psyState;var q=questions[st.q];
  st.score.scalp+=q.scores[i]===3?3:0;
  st.score.day+=q.scores[i]===2?2:0;
  st.score.swing+=q.scores[i]===1?1:0;
  st.score.invest+=q.scores[i]===0?0:0;
  st.score.scalp+=(i===0&&st.q===3)?3:0;
  st.score.day+=(i===1&&st.q===3)?2:0;
  st.score.swing+=(i===2&&st.q===3)?1:0;
  st.score.invest+=(i===3&&st.q===3)?0:0;
  st.lastAns=i;render();
}
function psyNext(){
  var st=window._psyState;st.q++;st.lastAns=undefined;render();
}
function psyQuizAnswer(i){
  var st=window._psyState;var q=biasQuiz[st.quizQ];
  st.lastQuizAns=i;if(i===q.correct)st.quizCorrect++;render();
}
function psyLogEmotion(i){
  var st=window._psyState;
  var emotions=[['Calm / Focused','success'],['Confident','success'],['Excited','gold'],['Anxious','gold'],['Frustrated','danger'],['Fearful','danger'],['Greedy','danger'],['Revenge Mode','danger']];
  var icons=['😌','😎','🤩','😰','😡','😨','🤑','🔥'];
  st.emotionLog.push({name:emotions[i][0],col:emotions[i][1],icon:icons[i],time:new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'})});
  render();
}
function psyScore(category,val){window._psyState.score[category]+=val;}
function psyRate(n){window._psyState.lastRating=n;render();}

function runSmartScan(){
  var s=getSym(globalTicker);
  function rng(max){return Math.floor(Math.random()*max);}
  var patterns=[
    {n:'Bullish Engulfing',act:'BUY',col:'success',desc:'Large green candle engulfing prior red. Reversal signal at support.'},
    {n:'Hammer',act:'BUY',col:'success',desc:'Long lower wick at support. Buyers rejected lower prices.'},
    {n:'Morning Star',act:'BUY',col:'success',desc:'3-candle bottom reversal. High reliability.'},
    {n:'VWAP Reclaim',act:'BUY',col:'success',desc:'Price reclaimed VWAP with volume. Bullish continuation.'},
    {n:'Bull Flag',act:'BUY',col:'success',desc:'Sharp rise, consolidation, ready for breakout.'},
    {n:'Double Bottom',act:'BUY',col:'success',desc:'Two touches at same low. Strong support confirmed.'},
    {n:'Shooting Star',act:'SELL',col:'danger',desc:'Long upper wick at resistance. Sellers dominated.'},
    {n:'Bearish Engulfing',act:'SELL',col:'danger',desc:'Large red engulfing prior green at highs.'},
    {n:'Evening Star',act:'SELL',col:'danger',desc:'3-candle top reversal. Bearish resolution.'},
    {n:'Head & Shoulders',act:'SELL',col:'danger',desc:'3 peaks with middle highest. Break neckline confirms.'},
    {n:'Doji',act:'HOLD',col:'gold',desc:'Indecision candle. Wait for direction confirmation.'},
    {n:'BB Squeeze',act:'HOLD',col:'gold',desc:'Bollinger Bands compressed. Big move imminent.'},
    {n:'Symmetrical Triangle',act:'HOLD',col:'gold',desc:'Converging pattern. Wait for breakout direction.'}
  ];
  var pat=patterns[Math.floor(Math.random()*patterns.length)];
  var conf=68+rng(20);
  var entry=parseFloat(s.p)||100;
  var stop=entry*0.97;
  var target=entry*1.05;
  if(pat.act==='SELL'){stop=entry*1.03;target=entry*0.95;}
  var el=document.getElementById('smartWizardResult');
  if(el){
    el.innerHTML='<div class="text-sm font-black text-white">'+pat.n+'</div>'+
      '<div class="flex items-center gap-1 mt-1"><span class="text-[8px] bg-'+pat.col+'/20 text-'+pat.col+' px-1.5 py-0.5 rounded font-bold">'+pat.act+'</span><span class="text-[8px] text-gold font-bold">'+conf+'% Confidence</span></div>'+
      '<p class="text-[9px] text-gray-400 mt-1.5">'+pat.desc+'</p>'+
      '<div class="grid grid-cols-3 gap-1 mt-2 text-center">'+
        '<div class="bg-success/10 rounded p-1"><div class="text-[7px] text-success uppercase font-bold">Entry</div><div class="text-[10px] text-white font-bold">$'+entry.toFixed(2)+'</div></div>'+
        '<div class="bg-danger/10 rounded p-1"><div class="text-[7px] text-danger uppercase font-bold">Stop</div><div class="text-[10px] text-white font-bold">$'+stop.toFixed(2)+'</div></div>'+
        '<div class="bg-accent/10 rounded p-1"><div class="text-[7px] text-accent uppercase font-bold">Target</div><div class="text-[10px] text-white font-bold">$'+target.toFixed(2)+'</div></div>'+
      '</div>'+
      '<div class="mt-2 p-1.5 bg-black/40 rounded text-[8px] text-gray-400"><span class="text-'+pat.col+' font-bold">NEXT MOVE:</span> '+pat.act+' \u2014 '+(pat.act==='BUY'?'Enter long on candle close. Scale 1/3 at 2R, trail rest with EMA20.':pat.act==='SELL'?'Exit longs or enter short. Stop above recent high. Target recent support.':'Wait for confirmation candle. Do not trade until direction is clear.')+'</div>';
  }
}
