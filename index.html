// ---------- SOUND SYNTH (Web Audio - no external files) ----------
var audioCtx = null;
function tone(freq, dur, type, vol, when){
  try{
    if(!soundCfg.master) return;
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type||'sine'; o.frequency.value = freq;
    g.gain.value = vol||0.06;
    o.connect(g); g.connect(audioCtx.destination);
    var t = audioCtx.currentTime + (when||0);
    o.start(t); g.gain.exponentialRampToValueAtTime(0.0001, t+(dur||0.18)); o.stop(t+(dur||0.18)+0.02);
  }catch(e){}
}
function playSound(kind){
  if(!soundCfg.master) return;
  if(kind==='win' && soundCfg.win){ tone(523,.12,'sine');tone(659,.12,'sine',.06,.1);tone(784,.2,'sine',.06,.2); }
  else if(kind==='loss' && soundCfg.loss){ tone(300,.25,'sawtooth',.05);tone(220,.3,'sawtooth',.05,.15); }
  else if(kind==='fill' && soundCfg.fill){ tone(880,.06,'square',.04); }
  else if(kind==='alert' && soundCfg.alert){
    if(soundCfg.profile==='ping') tone(1200,.15,'sine');
    else if(soundCfg.profile==='chime'){ tone(880,.2,'sine');tone(1108,.25,'sine',.05,.12); }
    else if(soundCfg.profile==='sweep'){ tone(400,.3,'sine');tone(900,.2,'sine',.05,.15); }
    else tone(1500,.1,'square',.04);
  }
}

function gwLog(msg, isErr){
  notifLog.unshift('['+new Date().toLocaleTimeString()+'] '+msg);
  var log=document.getElementById('gateway-log');
  if(log){ log.innerHTML+='<div class="'+(isErr?'text-red-400':'')+'">['+new Date().toLocaleTimeString()+'] '+msg+'</div>'; log.scrollTop=log.scrollHeight; }

function applyQuote(sym, price, chgPct){
  liveQuotes[sym]={price:+price, chg:(chgPct>=0?'+':'')+(+chgPct).toFixed(2)+'%', ts:Date.now()};
}
function fetchStockQuotes(syms){
  var key=apiKeys['finnhub'];
  if(!key||typeof fetch==='undefined') return Promise.resolve(false);
  var jobs=(syms||LIVE_CORE_SYMS).slice(0,12).map(function(sym){
    return fetch('https://finnhub.io/api/v1/quote?symbol='+encodeURIComponent(sym)+'&token='+encodeURIComponent(key))
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){ if(d && d.c>0){ applyQuote(sym, d.c, d.dp||0); return true; } return false; })
      .catch(function(){ return false; });
  });
  return Promise.all(jobs).then(function(res){
    var ok=res.some(function(x){return x;});
    if(ok && !liveStocksOk){ liveStocksOk=true; liveStockSrc='Finnhub'; gwLog('[FINNHUB] ✓ Live stock quotes streaming ('+res.filter(Boolean).length+' symbols).'); }
    if(!ok && key){ gwLog('[FINNHUB] ✗ No quotes returned — check the key or free-tier rate limit (60/min).', true); }
    return ok;
  });
}
// ===== FREE KEYLESS STOCK FEEDS (Yahoo Finance + Stooq — no API key required) =====
var liveStockSrc=null;
function fetchYahooQuotes(syms){
  if(typeof fetch==='undefined') return Promise.resolve(false);
  var list=(syms||LIVE_CORE_SYMS).slice(0,20).join(',');
  // Yahoo's public quote endpoint is keyless; route via CORS-friendly mirrors with direct fallback
  var target='https://query1.finance.yahoo.com/v8/finance/spark?symbols='+encodeURIComponent(list)+'&range=1d&interval=5m';
  var urls=[
    'https://api.allorigins.win/raw?url='+encodeURIComponent(target),
    'https://corsproxy.io/?url='+encodeURIComponent(target),
    target
  ];
  function tryUrl(i){
    if(i>=urls.length) return Promise.resolve(false);
    return fetch(urls[i])
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){
        var arr=(d&&d.spark&&d.spark.result)||(d&&d.result)||null;
        if(!arr||!arr.length) throw new Error('empty');
        var n=0;
        arr.forEach(function(row){
          try{
            var meta=row.response[0].meta;
            var px=meta.regularMarketPrice, prev=meta.chartPreviousClose||meta.previousClose;
            if(px>0){ applyQuote(row.symbol, px, prev>0?((px-prev)/prev*100):0); n++; }
          }catch(e){}
        });
        if(n>0){
          if(!liveStocksOk){ liveStocksOk=true; gwLog('[YAHOO] ✓ FREE keyless stock quotes streaming ('+n+' symbols) — no API key needed.'); }
          if(!liveStockSrc) liveStockSrc='Yahoo Finance';
          return true;
        }
        throw new Error('no quotes');
      })
      .catch(function(){ return tryUrl(i+1); });
  }
  return tryUrl(0);
}
function fetchStooqQuotes(syms){
  if(typeof fetch==='undefined') return Promise.resolve(false);
  // Stooq free CSV endpoint, keyless: s=aapl.us — daily close + change
  var list=(syms||LIVE_CORE_SYMS).slice(0,20).map(function(s){return s.toLowerCase()+'.us';}).join('+');
  var target='https://stooq.com/q/l/?s='+list+'&f=sd2t2ohlcvpn&h&e=csv';
  var urls=['https://api.allorigins.win/raw?url='+encodeURIComponent(target), target];
  function tryUrl(i){
    if(i>=urls.length) return Promise.resolve(false);
    return fetch(urls[i])
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(function(txt){
        var lines=txt.trim().split('\n'); if(lines.length<2) throw new Error('empty');
        var n=0;
        for(var li=1;li<lines.length;li++){
          var c=lines[li].split(',');
          // Symbol,Date,Time,Open,High,Low,Close,Volume,PrevClose,Name
          var sym=(c[0]||'').replace('.US','').toUpperCase(), close=parseFloat(c[6]), prev=parseFloat(c[8]);
          if(sym && close>0){ applyQuote(sym, close, prev>0?((close-prev)/prev*100):0); n++; }
        }
        if(n>0){
          if(!liveStocksOk){ liveStocksOk=true; gwLog('[STOOQ] ✓ FREE keyless stock quotes loaded ('+n+' symbols).'); }
          if(!liveStockSrc) liveStockSrc='Stooq (free)';
          return true;
        }
        throw new Error('no rows');
      })
      .catch(function(){ return tryUrl(i+1); });
  }
  return tryUrl(0);
}
function fetchFreeStockQuotes(syms){
  // chain: Yahoo first (real-time-ish), Stooq fallback (EOD) — both 100% keyless
  return fetchYahooQuotes(syms).then(function(ok){ return ok ? true : fetchStooqQuotes(syms); });
}

    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      var n=0;
      Object.keys(COINGECKO_IDS).forEach(function(sym){
        var row=d[COINGECKO_IDS[sym]];
        if(row && row.usd){ applyQuote(sym, row.usd, row.usd_24h_change||0);

          n++; }
      });
      if(n>0 && !liveCryptoOk){ liveCryptoOk=true; gwLog('[COINGECKO] ✓ Live crypto quotes streaming ('+n+' pairs, no key required).'); }
      return n>0;
    }).catch(function(){ return false; });
}

  var syms=LIVE_CORE_SYMS.slice();
  if(extraSym && syms.indexOf(extraSym)<0) syms.unshift(extraSym);
  // Stocks: Finnhub (if key) → else FREE keyless Yahoo → Stooq. Crypto: always free CoinGecko.
  var stockJob = apiKeys['finnhub'] ? fetchStockQuotes(syms).then(function(ok){ return ok ? true : fetchFreeStockQuotes(syms); }) : fetchFreeStockQuotes(syms);

      renderActiveTab();

function statCard(label, value, cls){

function panel(title, body, extra){
  return '<div class="bg-panel border border-gray-800 p-5 rounded-2xl space-y-3 shadow-xl '+(extra||'')+'"><h3 class="text-xs font-black uppercase text-accent tracking-wider border-b border-gray-850 pb-2">'+title+'</h3>'+body+'</div>';
}
function pageHead(icon, title, sub, right){
  var back = activeTab==='home' ? '' : '<button onclick="switchTab(\'home\')" class="text-[10px] text-gray-500 hover:text-accent font-bold mb-2 flex items-center gap-1 transition-all"><i class="fa-solid fa-arrow-left"></i> Return to Main Cockpit</button>';

}
function badge(txt, cls){ return '<span class="text-[9px] '+cls+' font-bold px-2 py-0.5 rounded font-mono uppercase">'+txt+'</span>'; }
function chgCls(s){ return (''+s).indexOf('-')===0 ? 'text-danger' : 'text-success'; }
function subBtn(active, onclick, label){

function chip(active, onclick, label){

function row2(l, r, lcls, rcls){

function infoBox(title, text, border){
  return '<div class="p-3 bg-dark/40 border '+(border||'border-gray-850')+' rounded-xl space-y-1"><span class="text-[9px] text-gray-500 font-black uppercase tracking-wider block">'+title+'</span><p class="text-[11px] text-gray-300 font-semibold leading-relaxed">'+text+'</p></div>';

function getSym(s){
  s=(s||'').toUpperCase();
  // 1) LIVE quote wins (real API data from Finnhub/CoinGecko)
  if(liveQuotes[s]){
    var base = SYMBOL_DB[s] ? Object.assign({}, SYMBOL_DB[s]) : null;
    var lq=liveQuotes[s];
    if(base){ base.price=lq.price; base.chg=lq.chg; base.live=true; return base; }
    var gen=getSymFallback(s); gen.price=lq.price; gen.chg=lq.chg; gen.live=true; return gen;
  }
  if(SYMBOL_DB[s]) return SYMBOL_DB[s];
  return getSymFallback(s);
}
function getSymFallback(s){
  // deterministic fallback — same symbol ALWAYS returns the same data (hash-seeded, no Math.random)
  var hsh=0; for(var i=0;i<s.length;i++){ hsh=(hsh*31+s.charCodeAt(i))>>>0; }
  function r(n){ return ((hsh>>>(n%13))%1000)/1000; }
  var price=+( (r(1)*200+10).toFixed(2) );
  var up=r(2)>0.45;
  return {name:s+' (Live Feed)',price:price,chg:(up?'+':'-')+((r(3)*4)+0.2).toFixed(2)+'%',float:Math.round(r(4)*300+20)+'M',si:(r(5)*18+1).toFixed(1)+'%',atr:+( (price*0.03+r(6)*2).toFixed(2) ),vol:(r(7)*40+2).toFixed(1)+'M',cap:'$'+(r(8)*80+1).toFixed(1)+'B',rsi:Math.round(r(9)*60+20),pe:+( (r(10)*40+8).toFixed(1) ),eps:+( (r(11)*8+0.5).toFixed(2) ),de:+( (r(12)*2).toFixed(2) ),desc:'Live data loads when API key is connected in Settings → Data Sources.'};
}

function drawCandleChart(canvasId, seed, accentLevel){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||600, h=c.height=c.offsetHeight||280;
  var ctx=c.getContext('2d'); if(!ctx) return;
  ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1a1d27'; ctx.lineWidth=1;
  for(var gy=0;gy<5;gy++){ ctx.beginPath(); ctx.moveTo(0,h*gy/5); ctx.lineTo(w,h*gy/5); ctx.stroke(); }
  var n=Math.floor(w/9), px=0, price=seed||100, rng=mulberry(seed||42);
  for(var i=0;i<n;i++){
    var o=price, cl=price+(rng()-0.48)*price*0.012;
    var hi=Math.max(o,cl)+rng()*price*0.005, lo=Math.min(o,cl)-rng()*price*0.005;
    var minP=price*0.94, maxP=price*1.06;
    function y(p){ return h-( (p-minP)/(maxP-minP) )*h; }
    var up=cl>=o; ctx.strokeStyle=up?'#10b981':'#ef4444'; ctx.fillStyle=up?'#10b981':'#ef4444';
    ctx.beginPath(); ctx.moveTo(px+4,y(hi)); ctx.lineTo(px+4,y(lo)); ctx.stroke();
    var bt=y(Math.max(o,cl)), bh=Math.max(2,Math.abs(y(o)-y(cl)));
    ctx.fillRect(px+1,bt,6,bh);
    price=cl; px+=9;
  }
  if(accentLevel){
    ctx.strokeStyle='#7c3aed'; ctx.setLineDash([4,4]); ctx.beginPath();
    ctx.moveTo(0,h*0.55); ctx.lineTo(w,h*0.55); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#7c3aed'; ctx.font='9px monospace'; ctx.fillText('VWAP',6,h*0.55-4);
  }
}
function mulberry(a){ return function(){ a|=0;a=a+0x6D2B79F5|0; var t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

function drawLineChart(canvasId, pts, color, fill){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||600, h=c.height=c.offsetHeight||200;
  var ctx=c.getContext('2d');
  ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1a1d27'; for(var gy=1;gy<4;gy++){ ctx.beginPath();ctx.moveTo(0,h*gy/4);ctx.lineTo(w,h*gy/4);ctx.stroke(); }
  var mn=Math.min.apply(null,pts), mx=Math.max.apply(null,pts), pad=(mx-mn)*0.1||1;
  mn-=pad; mx+=pad;
  ctx.beginPath();
  for(var i=0;i<pts.length;i++){
    var x=i/(pts.length-1)*w, y=h-(pts[i]-mn)/(mx-mn)*h;
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle=color||'#10b981'; ctx.lineWidth=2; ctx.stroke();
  if(fill){
    ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath();
    var g=ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,(color||'#10b981')+'33'); g.addColorStop(1,'transparent');
    ctx.fillStyle=g; ctx.fill();
  }
}
function drawDonut(canvasId, parts, colors){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||300, h=c.height=c.offsetHeight||200;
  var ctx=c.getContext('2d'); ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,w,h);
  var cx=w/2, cy=h/2, r=Math.min(w,h)/2-14, total=0, i;
  for(i=0;i<parts.length;i++) total+=parts[i];
  var ang=-Math.PI/2;
  for(i=0;i<parts.length;i++){
    var a2=ang+parts[i]/total*Math.PI*2;
    ctx.beginPath(); ctx.arc(cx,cy,r,ang,a2); ctx.arc(cx,cy,r*0.6,a2,ang,true); ctx.closePath();
    ctx.fillStyle=colors[i]; ctx.fill(); ang=a2;
  }
}
function drawPayoff(canvasId){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||600, h=c.height=c.offsetHeight||250;
  var ctx=c.getContext('2d'); ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1a1d27'; for(var gy=1;gy<5;gy++){ctx.beginPath();ctx.moveTo(0,h*gy/5);ctx.lineTo(w,h*gy/5);ctx.stroke();}
  var mid=h*0.5;
  ctx.strokeStyle='#374151'; ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid); ctx.stroke();
  // Iron condor expiry payoff
  ctx.beginPath(); ctx.moveTo(0,mid+60); ctx.lineTo(w*0.25,mid+60); ctx.lineTo(w*0.38,mid-45); ctx.lineTo(w*0.62,mid-45); ctx.lineTo(w*0.75,mid+60); ctx.lineTo(w,mid+60);
  ctx.strokeStyle='#10b981'; ctx.lineWidth=2.5; ctx.stroke();
  // profit fill
  ctx.save(); ctx.beginPath(); ctx.moveTo(w*0.31,mid); ctx.lineTo(w*0.38,mid-45); ctx.lineTo(w*0.62,mid-45); ctx.lineTo(w*0.69,mid); ctx.closePath();
  ctx.fillStyle='rgba(16,185,129,0.15)'; ctx.fill(); ctx.restore();
  // T+0 curve
  ctx.beginPath();
  for(var x=0;x<=w;x+=4){
    var t=(x/w-0.5)*4;
    var y=mid-35*Math.exp(-t*t)+12;
    if(x===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle='#7c3aed'; ctx.lineWidth=1.5; ctx.setLineDash([5,4]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#6b7280'; ctx.font='9px monospace';
  ctx.fillText('Expiry payoff',8,14); ctx.fillStyle='#7c3aed'; ctx.fillText('T+0 curve',8,26);
}

function drawValDonut(canvasId, parts, colors, centerTxt, subTxt, hiIdx){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||260, h=c.height=c.offsetHeight||200;
  var ctx=c.getContext('2d'); ctx.clearRect(0,0,w,h);
  var cx=w/2, cy=h/2, r=Math.min(w,h)/2-10, total=0, i;
  for(i=0;i<parts.length;i++) total+=parts[i];
  if(total<=0) total=1;
  var ang=-Math.PI/2;
  for(i=0;i<parts.length;i++){
    var a2=ang+parts[i]/total*Math.PI*2;
    var rr=(hiIdx===i)?r:(hiIdx===undefined||hiIdx===null||hiIdx<0)?r:r*0.92;
    ctx.beginPath(); ctx.arc(cx,cy,rr,ang+0.015,a2-0.015); ctx.arc(cx,cy,rr*0.66,a2-0.015,ang+0.015,true); ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];
    ctx.globalAlpha=(hiIdx===undefined||hiIdx===null||hiIdx<0||hiIdx===i)?1:0.25;
    ctx.fill(); ctx.globalAlpha=1; ang=a2;
  }
  ctx.fillStyle='#fff'; ctx.font='bold 16px monospace'; ctx.textAlign='center';
  ctx.fillText(centerTxt, cx, cy-2);
  if(subTxt){ ctx.fillStyle='#6b7280'; ctx.font='8px sans-serif'; ctx.fillText(subTxt, cx, cy+12); }
  ctx.textAlign='left';
}
function drawValRatios(canvasId, years, pe, ps){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||500, h=c.height=c.offsetHeight||200;
  var ctx=c.getContext('2d'); ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,w,h);
  var padL=34, padB=22, padT=12, pw=w-padL-8, ph=h-padT-padB;
  var all=pe.concat(ps), mx=Math.max.apply(null,all)*1.15||1, mn=0;
  ctx.strokeStyle='#1a1d27'; ctx.fillStyle='#6b7280'; ctx.font='8px monospace';
  for(var gy=0;gy<=4;gy++){
    var yv=mn+(mx-mn)*gy/4, y=padT+ph-(yv-mn)/(mx-mn)*ph;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-8,y); ctx.stroke();
    ctx.fillText(yv.toFixed(0),4,y+3);
  }
  function line(arr,color){
    ctx.beginPath();
    for(var i=0;i<arr.length;i++){
      var x=padL+pw*i/(arr.length-1), y=padT+ph-(arr[i]-mn)/(mx-mn)*ph;
      if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle=color; ctx.lineWidth=2; ctx.stroke();
    for(var j=0;j<arr.length;j++){
      var x2=padL+pw*j/(arr.length-1), y2=padT+ph-(arr[j]-mn)/(mx-mn)*ph;
      ctx.beginPath(); ctx.arc(x2,y2,3,0,Math.PI*2); ctx.fillStyle=color; ctx.fill();
    }
  }
  line(pe,'#f59e0b'); line(ps,'#3b82f6');
  ctx.fillStyle='#6b7280'; ctx.font='8px monospace'; ctx.textAlign='center';
  for(var k=0;k<years.length;k++){ ctx.fillText(years[k], padL+pw*k/(years.length-1), h-8); }
  ctx.textAlign='left';
}
function drawValPerf(canvasId, years, rev, ni, margin){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||500, h=c.height=c.offsetHeight||200;
  var ctx=c.getContext('2d'); ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,w,h);
  var padL=38, padB=22, padT=12, pw=w-padL-8, ph=h-padT-padB;
  var mx=Math.max.apply(null,rev)*1.15||1;
  ctx.strokeStyle='#1a1d27'; ctx.fillStyle='#6b7280'; ctx.font='8px monospace';
  for(var gy=0;gy<=4;gy++){
    var yv=mx*gy/4, y=padT+ph-yv/mx*ph;
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(w-8,y); ctx.stroke();
    ctx.fillText(yv>=1000?(yv/1000).toFixed(1)+'T':yv.toFixed(0)+'B',2,y+3);
  }
  var n=years.length, slot=pw/n, bw=Math.min(22,slot*0.28);
  for(var i=0;i<n;i++){
    var cx0=padL+slot*i+slot/2;
    var rh=Math.max(2,rev[i]/mx*ph), nh=Math.max(2,Math.abs(ni[i])/mx*ph);
    ctx.fillStyle='#3b82f6'; ctx.fillRect(cx0-bw-2, padT+ph-rh, bw, rh);
    ctx.fillStyle=ni[i]>=0?'#10b981':'#ef4444'; ctx.fillRect(cx0+2, padT+ph-(ni[i]>=0?nh:0), bw, nh);
    ctx.fillStyle='#6b7280'; ctx.font='8px monospace'; ctx.textAlign='center';
    ctx.fillText(years[i], cx0, h-8); ctx.textAlign='left';
  }
  // margin line on its own scale
  var mMx=Math.max.apply(null,margin.map(Math.abs))*1.3||1;
  ctx.beginPath();
  for(var j=0;j<n;j++){
    var x=padL+slot*j+slot/2, y=padT+ph-Math.max(0,margin[j])/mMx*ph;
    if(j===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=2; ctx.stroke();
  for(var k=0;k<n;k++){
    var x2=padL+slot*k+slot/2, y2=padT+ph-Math.max(0,margin[k])/mMx*ph;
    ctx.beginPath(); ctx.arc(x2,y2,3,0,Math.PI*2); ctx.fillStyle='#f59e0b'; ctx.fill();
  }
}
function drawValWaterfall(canvasId, steps){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||520, h=c.height=c.offsetHeight||220;
  var ctx=c.getContext('2d'); ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,w,h);
  var padL=8, padB=34, padT=14, pw=w-padL-8, ph=h-padT-padB;
  var mx=0; steps.forEach(function(s){ mx=Math.max(mx,Math.abs(s[1])); }); mx*=1.12;
  ctx.strokeStyle='#1a1d27';
  for(var gy=1;gy<4;gy++){ ctx.beginPath(); ctx.moveTo(padL,padT+ph*gy/4); ctx.lineTo(w-8,padT+ph*gy/4); ctx.stroke(); }
  var n=steps.length, slot=pw/n, bw=Math.min(40,slot*0.62);
  for(var i=0;i<n;i++){
    var s=steps[i], v=Math.abs(s[1]), bh=Math.max(3,v/mx*ph);
    var x=padL+slot*i+(slot-bw)/2;
    var col = s[2]==='in'?'#10b981' : s[2]==='out'?'#ec4899' : s[2]==='total'?'#3b82f6' : '#6b7280';
    ctx.fillStyle=col; ctx.fillRect(x, padT+ph-bh, bw, bh);
    ctx.fillStyle='#9ca3af'; ctx.font='bold 8px monospace'; ctx.textAlign='center';
    ctx.fillText((s[1]>=0?'':'-')+'$'+v.toFixed(v<10?1:0)+'B', x+bw/2, padT+ph-bh-4);
    ctx.fillStyle='#6b7280'; ctx.font='7px sans-serif';
    var label=s[0].split(' ');
    for(var li=0;li<label.length&&li<2;li++){ ctx.fillText(label.slice(li*2,li*2+2).join(' '), x+bw/2, h-22+li*9); }
    ctx.textAlign='left';
  }
}

var heatBucketFilter=null;
var heatSectorOnly=null;
var HEAT_BUCKETS=[['-3%','#8f1d1d',-99,-2.5],['-2%','#c0392b',-2.5,-1.5],['-1%','#dd7068',-1.5,-0.5],['0%','#565b64',-0.5,0.5],['1%','#5fb582',0.5,1.5],['2%','#2f9e5f',1.5,2.5],['3%','#137a46',2.5,99]];
function heatBucket(v){ for(var i=0;i<HEAT_BUCKETS.length;i++){ if(v>HEAT_BUCKETS[i][2]&&v<=HEAT_BUCKETS[i][3]) return i; } return 3; }
function hmHash(s){ var x=7; for(var i=0;i<s.length;i++){ x=(x*31+s.charCodeAt(i))>>>0; } return x; }
function hmMetrics(it){ // it = [ticker,name,price,chg,sizeTier]
  var hsh=hmHash(it[0]); function r(n){ return ((hsh>>>(n%13))%100)/100; }
  var tier=it[4]==='XL'?2200:it[4]==='L'?700:it[4]==='M'?180:45;
  var cap=tier*(0.6+r(1)*0.9);
  return { cap:cap, employees:Math.round(cap*(40+r(2)*120)), divYield:+(r(3)*3.2).toFixed(2),
    pe:+(12+r(4)*55).toFixed(1), ps:+(1.5+r(5)*18).toFixed(1), pbFY:+(1+r(6)*30).toFixed(1), pbMRQ:+(1+r(7)*28).toFixed(1),
    vol1h:cap*(0.002+r(8)*0.004), vol4h:cap*(0.008+r(9)*0.012), volD:cap*(0.02+r(10)*0.05), volW:cap*(0.1+r(11)*0.2), volM:cap*(0.4+r(12)*0.8) };
}
var HEAT_SIZE_OPTS=[['cap','Market Cap'],['employees','Number of employees'],['divYield','Dividend Yield, %'],['pe','Price to Earnings Ratio (TTM)'],['ps','Price to Sales (FY)'],['pbFY','Price to Book (FY)'],['pbMRQ','Price to Book (MRQ)'],['vol1h','Volume 1h'],['vol4h','Volume 4h'],['volD','Volume D'],['volW','Volume W'],['volM','Volume M'],['vp1h','Volume\u00d7Price 1h'],['vp4h','Volume\u00d7Price 4h'],['vpD','Volume\u00d7Price D'],['vpW','Volume\u00d7Price W'],['vpM','Volume\u00d7Price M']];
function hmWeight(it){
  var m=hmMetrics(it);
  switch(heatSizeBy){
    case 'employees': return m.employees;
    case 'divYield': return m.divYield+0.05;
    case 'pe': return m.pe; case 'ps': return m.ps;
    case 'pbFY': return m.pbFY; case 'pbMRQ': return m.pbMRQ;
    case 'vol1h': return m.vol1h; case 'vol4h': return m.vol4h;
    case 'volD': return m.volD; case 'volW': return m.volW; case 'volM': return m.volM;
    case 'vp1h': return m.vol1h*it[2]; case 'vp4h': return m.vol4h*it[2];
    case 'vpD': return m.volD*it[2]; case 'vpW': return m.volW*it[2]; case 'vpM': return m.volM*it[2];
    default: return m.cap;
  }
}
function hmTreemap(items,x,y,w,h,out){
  if(!items.length) return;
  if(items.length===1){ out.push({it:items[0].it,x:x,y:y,w:w,h:h}); return; }
  var total=0; items.forEach(function(a){ total+=a.wt; });
  if(total<=0) total=1;
  var accA=0, idx=1;
  for(var i=0;i<items.length-1;i++){ accA+=items[i].wt; idx=i+1; if(accA>=total/2) break; }
  var A=items.slice(0,idx), B=items.slice(idx), ratio=Math.max(0.08,Math.min(0.92,accA/total));
  if(w>=h){ hmTreemap(A,x,y,w*ratio,h,out); hmTreemap(B,x+w*ratio,y,w*(1-ratio),h,out); }
  else { hmTreemap(A,x,y,w,h*ratio,out); hmTreemap(B,x,y+h*ratio,w,h*(1-ratio),out); }
}
function hmBlockColor(it){
  var chg=it[3];
  if(heatColorBy==='rsi'){ var rsi=50+chg*8; return rsi>70?'#6d28d9':rsi<30?'#b45309':'#565b64'; }
  return HEAT_BUCKETS[heatBucket(chg)][1];
}

function drawIndPreview(canvasId, name){
  var c=document.getElementById(canvasId); if(!c) return;
  var w=c.width=c.offsetWidth||500, h=c.height=c.offsetHeight||120;
  var ctx=c.getContext('2d'); ctx.fillStyle='#0a0b0f'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#1a1d27'; for(var gy=1;gy<3;gy++){ ctx.beginPath(); ctx.moveTo(0,h*gy/3); ctx.lineTo(w,h*gy/3); ctx.stroke(); }
  var rng=mulberry(hmHash(name)), n=Math.floor(w/6);
  var osc=/RSI|Stochastic|MACD|Momentum|Oscillator|%R|CCI|TRIX|Fisher|ROC|Rate|Index|TSV|Force|Power|Flow/i.test(name);
  ctx.beginPath();
  var v=0.5;
  for(var i=0;i<n;i++){
    v=Math.max(0.05,Math.min(0.95, v+(rng()-0.5)*0.18 ));
    var x=i/(n-1)*w, y=h-(osc? v : (0.2+ (i/n)*0.45 + (v-0.5)*0.3))*h;
    if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  ctx.strokeStyle='#f59e0b'; ctx.lineWidth=1.8; ctx.stroke();
  if(osc){
    ctx.strokeStyle='#374151'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(0,h*0.25); ctx.lineTo(w,h*0.25); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0,h*0.75); ctx.lineTo(w,h*0.75); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#6b7280'; ctx.font='8px monospace'; ctx.fillText('OB',4,h*0.25-3); ctx.fillText('OS',4,h*0.75+9);
  }
}

 'All':'Showing every $1M+ movement across all chains in the last 24h.',

  if(whaleFilter==='All') return true;
  if(whaleFilter==='SELLING PRESSURE') return t[3]==='DEPOSIT';
  if(whaleFilter==='ACCUMULATION') return t[3]==='WITHDRAWAL';
  if(whaleFilter==='NEUTRAL') return t[3]==='TRANSFER';
  return t[0]===whaleFilter;
}

function whenToUse(cat){
  var m={
   'Scalping':'Execute during high-volume opening hours (9:30-10:30 AM ET) on tight-spread, high-liquidity names.',
   'Reversal':'Deploy near major value areas, pivot supports, or overextended outer-band exhaustion zones.',
   'Trend':'Best in strong bull/bear regimes. Enter pullbacks to 20 EMA/VWAP once momentum reclaims the trend.',
   'Trap':'Use when price sweeps an obvious level but volume shows immediate institutional absorption and failure.',
   'Volatility':'Deploy during compressions (inside days, squeeze dots) ahead of explosive range expansion.',
   'Momentum':'Trade only with 2x+ relative volume and a fresh catalyst; never chase extended candles.',
   'Continuation':'Mid-trend rests and flags; confirm volume dries up inside the pause before the break.',
   'Breakout':'Multi-day/week bases breaking with 2x relative volume; failed breakouts become trap trades.',
   'Harmonic':'Only at completed PRZ zones with momentum divergence; never anticipate the completion.',
   'Liquidity':'Around obvious equal highs/lows where retail stops cluster — trade the sweep, not the level.',
   'Risk Mgmt':'Always-on overlay; deploy hedging legs around scheduled news risk windows.',
   'Danger Zone':'Inside euphoric extension bands only — confirmation prints mandatory, half size maximum.',
   'Cycle':'When cycle clustering signals compression; expansion follows within 3-5 bars typically.',
   'Multi-Signal':'Only when 3+ independent signals align; the rarest but highest win-rate condition.',
   'Zone-Based':'At pre-mapped institutional zones; ladder entries across the band, never all-in.',
   'Precision':'Sweep-rejection ticks at HVN edges; requires Level 2 and fast hands.',
   'Pullback':'In established trends only — count the wave structure before entering the retrace.',
   'Rhythm':'Steady trend days with repeating cadence; abandon instantly on rhythm break.',
   'Complex':'Expert-only confluence prints; paper trade 50 reps before going live.',
   'Alert-Based':'When tape-speed alerts fire simultaneously with chart signals.',
   'Options/Technical':'Pair chart structure with IV rank: buy premium <30 rank, sell premium >50 rank.'
  };
  return m[cat]||'Apply when 1m, 5m and 1H indicators reach full directional alignment, confirming structural consensus.';
}

function testKey(id,name){
  playSound('alert');
  var input=document.getElementById('key-'+id);
  if(input && input.value) saveKey(id, input.value);
  var key=apiKeys[id];
  var b=document.getElementById('st-'+id);
  function setBadge(txt, cls){ if(b){ b.textContent=txt; b.className='text-[9px] '+cls+' font-bold px-2 py-0.5 rounded font-mono uppercase'; } }
  // Keyless free feeds: Yahoo & Google rows test the free pipeline directly — no key needed
  if(id==='yahoo'||id==='goog'){
    setBadge('Testing…','bg-accent/15 text-accent');
    gwLog('['+name.toUpperCase()+'] FREE keyless feed — pinging live endpoint (no key required)…');
    fetchFreeStockQuotes(['AAPL','TSLA','NVDA']).then(function(ok){
      if(ok){ var p=liveQuotes['AAPL']?('AAPL $'+(+liveQuotes['AAPL'].price).toFixed(2)):'quotes received'; setBadge('LIVE FREE ✓','bg-success/15 text-success'); playSound('win'); gwLog('['+name.toUpperCase()+'] ✓ FREE feed LIVE — '+p+'. No API key needed.'); lastLiveUpdate=new Date().toLocaleTimeString(); buildTickers(); renderActiveTab(); }
      else { setBadge('Blocked','bg-red-500/10 text-red-400'); playSound('loss'); gwLog('['+name.toUpperCase()+'] ✗ Free endpoint unreachable (network/CORS mirror down) — Stooq fallback also failed. Retry with Update Now.', true); }
    });
    return;
  }
  if(!key){ setBadge('No Key','bg-gold/10 text-gold'); gwLog('['+name.toUpperCase()+'] ✗ No key entered — paste a key first.', true); return; }
  setBadge('Testing…','bg-accent/15 text-accent');
  gwLog('['+name.toUpperCase()+'] Handshake initiated… validating key against live API…');
  // REAL validation for data providers; CORS-restricted brokers get a saved-key acknowledgment
  if(id==='finnhub'){
    fetch('https://finnhub.io/api/v1/quote?symbol=AAPL&token='+encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.c>0){ setBadge('LIVE ✓','bg-success/15 text-success'); playSound('win'); gwLog('[FINNHUB] ✓ VALID — AAPL real quote $'+d.c.toFixed(2)+' ('+(d.dp>=0?'+':'')+(d.dp||0).toFixed(2)+'%). Live engine starting…'); startLiveEngine(); }

      }).catch(function(e){ setBadge('Error','bg-red-500/10 text-red-400'); gwLog('[FINNHUB] ✗ Network error: '+e.message, true); });
  } else if(id==='av'){
    fetch('https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=AAPL&apikey='+encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(d){
        var q=d['Global Quote'];
        if(q && q['05. price']){ setBadge('LIVE ✓','bg-success/15 text-success'); playSound('win'); gwLog('[ALPHAVANTAGE] ✓ VALID — AAPL $'+(+q['05. price']).toFixed(2)+'.'); }
        else if(d.Note||d.Information){ setBadge('Rate Limit','bg-gold/10 text-gold'); gwLog('[ALPHAVANTAGE] ⚠ Key OK but rate-limited (free = 25 req/day).'); }
        else { setBadge('Invalid','bg-red-500/10 text-red-400'); playSound('loss'); gwLog('[ALPHAVANTAGE] ✗ Key rejected.', true); }
      }).catch(function(e){ setBadge('Error','bg-red-500/10 text-red-400'); gwLog('[ALPHAVANTAGE] ✗ Network error: '+e.message, true); });
  } else if(id==='polygon'){
    fetch('https://api.polygon.io/v2/aggs/ticker/AAPL/prev?apiKey='+encodeURIComponent(key))
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.status!=='ERROR' && d.results && d.results.length){ setBadge('LIVE ✓','bg-success/15 text-success'); playSound('win'); gwLog('[POLYGON] ✓ VALID — AAPL prev close $'+d.results[0].c+'.'); }
        else { setBadge('Invalid','bg-red-500/10 text-red-400'); playSound('loss'); gwLog('[POLYGON] ✗ '+(d.error||'Key rejected.'), true); }
      }).catch(function(e){ setBadge('Error','bg-red-500/10 text-red-400'); gwLog('[POLYGON] ✗ Network error: '+e.message, true); });
  } else {
    // brokers (Alpaca/Tasty/IBKR/etc.) block browser CORS — key is stored for backend/order use
    setBadge('Key Saved ✓','bg-success/15 text-success');
    gwLog('['+name.toUpperCase()+'] ✓ Key stored locally (base64 localStorage). Note: '+name+' blocks direct browser calls (CORS) — execution requires their official app or a server-side relay. Data feeds: use Finnhub/Polygon/AlphaVantage keys for live quotes here.');
  }
}
