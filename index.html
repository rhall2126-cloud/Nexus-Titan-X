<script>
// DATA
var SYMS={TSLA:{n:'Tesla',p:242.50,c:2.40,vol:'98M',rsi:58,atr:8.2,float:'2.7B',si:3.1,pe:62,mcap:'775B',sec:'Consumer'},AAPL:{n:'Apple',p:178.40,c:1.10,vol:'55M',rsi:62,atr:3.1,float:'15.5B',si:0.7,pe:29,mcap:'2780B',sec:'Tech'},NVDA:{n:'NVIDIA',p:485.20,c:4.80,vol:'180M',rsi:71,atr:12.5,float:'2.5B',si:1.2,pe:68,mcap:'1198B',sec:'Tech'},MSFT:{n:'Microsoft',p:415.60,c:0.85,vol:'22M',rsi:55,atr:6.2,float:'7.4B',si:0.6,pe:36,mcap:'3090B',sec:'Tech'},AMZN:{n:'Amazon',p:175.35,c:-0.45,vol:'45M',rsi:48,atr:4.1,float:'10.4B',si:0.8,pe:75,mcap:'1820B',sec:'Consumer'},META:{n:'Meta',p:492.10,c:1.75,vol:'18M',rsi:63,atr:8.8,float:'2.5B',si:1.1,pe:32,mcap:'1255B',sec:'Tech'},GOOGL:{n:'Alphabet',p:172.50,c:1.15,vol:'28M',rsi:59,atr:4.2,float:'12.5B',si:0.5,pe:27,mcap:'2145B',sec:'Tech'},AMD:{n:'AMD',p:168.45,c:3.12,vol:'62M',rsi:64,atr:6.8,float:'1.6B',si:2.4,pe:310,mcap:'272B',sec:'Tech'},GME:{n:'GameStop',p:14.80,c:-1.20,vol:'12M',rsi:38,atr:1.2,float:'300M',si:18.5,pe:0,mcap:'45B',sec:'Consumer'},PLTR:{n:'Palantir',p:24.50,c:5.20,vol:'68M',rsi:72,atr:1.8,float:'2.1B',si:4.2,pe:225,mcap:'52B',sec:'Tech'},COIN:{n:'Coinbase',p:228.40,c:3.50,vol:'9M',rsi:65,atr:14,float:'200M',si:8.1,pe:45,mcap:'57B',sec:'Finance'},BTC:{n:'Bitcoin',p:67250,c:1.85,vol:'$38B',rsi:56,atr:1800,float:0,si:0,pe:0,mcap:'1325B',sec:'Crypto'},ETH:{n:'Ethereum',p:3520,c:2.15,vol:'$18B',rsi:61,atr:95,float:0,si:0,pe:0,mcap:'423B',sec:'Crypto'},SOL:{n:'Solana',p:168,c:4.20,vol:'$4B',rsi:68,atr:8,float:0,si:0,pe:0,mcap:'75B',sec:'Crypto'},DOGE:{n:'Dogecoin',p:0.132,c:1.50,vol:'$1.5B',rsi:50,atr:0.005,float:0,si:0,pe:0,mcap:'19B',sec:'Crypto'},SPY:{n:'SPDR S&P500',p:524.75,c:0.42,vol:'85M',rsi:57,atr:4.5,float:'950M',si:0,pe:24,mcap:'4700B',sec:'ETF'},QQQ:{n:'Invesco QQQ',p:448.30,c:0.55,vol:'35M',rsi:60,atr:5.8,float:'400M',si:0,pe:28,mcap:'2000B',sec:'ETF'}};
function getSym(t){t=(t||'TSLA').toUpperCase().trim();if(SYMS[t])return Object.assign({t:t},SYMS[t]);var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%100000;return{t:t,n:t+' Inc.',p:(20+h%400).toFixed(2),c:((h%200)/10-10).toFixed(2),vol:(h%90+10)+'M',rsi:h%100,atr:(h%10+0.5).toFixed(1),float:(h%5+0.5).toFixed(1)+'B',si:((h%25)/10).toFixed(1),pe:(h%80+5).toFixed(1),mcap:(h%900+50)+'B',sec:'Other'};}
var NAV=[{g:'CORE',items:[['home','fa-house','Home'],['allinone','fa-layer-group','All-In-One'],['procharts','fa-chart-line','Pro Charts'],['heatmaps','fa-table-cells-large','Heatmaps'],['global','fa-globe','Global Markets'],['symbol','fa-magnifying-glass','Symbol Detail'],['scanner','fa-radar','Scanner'],['shortinterest','fa-arrow-down','Short Interest'],['sessions','fa-clock','Sessions'],['premarket','fa-sun','Pre-Market']]},{g:'AI & BOTS',items:[['aichart','fa-brain','AI Chart Engine'],['autotrader','fa-robot','AutoTrader'],['oraclebots','fa-microchip','Oracle Bots'],['morning','fa-newspaper','Morning Brief'],['journal','fa-book','AI Journal'],['tradejournal','fa-clipboard-list','Trade Journal']]},{g:'TRADING',items:[['paper','fa-gamepad','Paper Trading'],['multichart','fa-table-cells','Multi-Chart'],['smartstop','fa-shield','Smart Stop'],['options','fa-list-ul','Options Chain'],['analysis','fa-chart-gantt','Analysis Mode'],['alerts','fa-bell','Alerts']]},{g:'ANALYTICS',items:[['backtest','fa-flask','Backtesting'],['correlation','fa-link','Correlation'],['regime','fa-wave-square','Market Regime'],['signals','fa-tower-broadcast','Signals'],['fib','fa-ruler','Fib & Pivot'],['tpo','fa-bars-staggered','TPO Profile'],['dayweek','fa-calendar-week','Day/Week Perf.']]},{g:'CRYPTO',items:[['cryptodash','fa-bitcoin','Crypto Dash'],['onchain','fa-link','On-Chain'],['altseason','fa-shuffle','Alt Season'],['whale','fa-fish-fins','Whale Tracker']]},{g:'EDUCATION',items:[['playbook','fa-chess','Strategy Playbook'],['candles','fa-fire','Candle Encyclopedia'],['psychology','fa-user-graduate','Psychology'],['help','fa-circle-question','Help Guide'],['settings','fa-gear','Settings'],['terms','fa-file-contract','Terms']]}];
var ticker='TSLA',activeTab='home',activeSub={},watchlist=['TSLA','AAPL','NVDA','AMZN','META','PLTR','BTC','ETH'];
var paperCash=100000,paperPos=[];
// EVENT DELEGATION - handles ALL clicks via data attributes
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-tab]');if(el){switchTab(el.dataset.tab);return;}
  el=e.target.closest('[data-ticker]');if(el){ticker=el.dataset.ticker;switchTab('symbol');return;}
  el=e.target.closest('[data-action]');if(el){
    var a=el.dataset.action,arg=el.dataset.arg;
    if(a==='search'){var v=document.getElementById('globalSearch').value.toUpperCase().trim();if(v){ticker=v;switchTab('symbol');}}
    else if(a==='sub'){activeSub[el.dataset.key]=arg;render();}
    else if(a==='toggleBot'){window._botStates=window._botStates||{};window._botStates[arg]=!window._botStates[arg];render();}
    else if(a==='toggleAll'){for(var i=0;i<10;i++){window._botStates=window._botStates||{};window._botStates[i]=arg==='on';}render();}
    else if(a==='smartScan'){runSmartScan();}
    else if(a==='paperBuy'){var q=parseInt(document.getElementById('tQty')&&document.getElementById('tQty').value)||100;var s=getSym(ticker);if(paperCash>=q*s.p){paperCash-=q*s.p;paperPos.push({sym:ticker,qty:q,price:s.p});render();}}
    else if(a==='paperSell'){var q=parseInt(document.getElementById('tQty')&&document.getElementById('tQty').value)||100;paperCash+=q*getSym(ticker).p;paperPos.push({sym:ticker,qty:-q,price:getSym(ticker).p});render();}
    else if(a==='paperClose'){paperCash+=paperPos[parseInt(arg)].qty*getSym(paperPos[parseInt(arg)].sym).p;paperPos.splice(parseInt(arg),1);render();}
    else if(a==='addWatch'){var inp=document.getElementById('watchInput');if(inp&&inp.value.trim()){var t=inp.value.toUpperCase().trim();if(watchlist.indexOf(t)<0)watchlist.push(t);inp.value='';render();}}
    else if(a==='removeWatch'){watchlist=watchlist.filter(function(x){return x!==arg;});render();}
    else if(a==='alert'){alert(arg);}
    return;
  }
});
// HELPERS
function pctC(c){return parseFloat(c)>=0?'text-success':'text-danger'}function pctA(c){return parseFloat(c)>=0?'\u25b2':'\u25bc'}
function card(t,b){return '<div class="bg-panel border border-gray-800 rounded-2xl p-4 mb-3">'+(t?'<div class="text-[10px] font-black uppercase tracking-wider text-accent mb-2 pb-2 border-b border-gray-800">'+t+'</div>':'')+b+'</div>'}
function stat(l,v,c){return '<div class="bg-panel border border-gray-800 rounded-xl p-2 text-center"><div class="text-[8px] text-gray-500 uppercase font-bold">'+l+'</div><div class="text-sm font-black mt-0.5 '+(c||'text-white')+'">'+v+'</div></div>'}
function btn(label,action,arg,cls){return '<button class="btn '+(cls||'bg-accent text-white px-3 py-1.5 rounded-lg text-xs font-bold')+'" data-action="'+action+'"'+(arg?' data-arg="'+arg+'"':'')+'>'+label+'</button>'}
// SIDEBAR
function buildSidebar(){var h='';NAV.forEach(function(g){h+='<div class="text-[9px] font-black uppercase tracking-widest text-gray-600 px-2 pt-3 pb-1">'+g.g+'</div>';g.items.forEach(function(i){h+='<div data-tab="'+i[0]+'" class="nav-btn w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg text-[11px] font-semibold '+(activeTab===i[0]?'tab-active':'text-gray-400 hover:text-white')+'"><i class="fa-solid '+i[1]+' text-xs w-4 text-center"></i> '+i[2]+'</div>';});});document.getElementById('sidebar').innerHTML=h;}
function switchTab(tab){activeTab=tab;buildSidebar();render();}
// CHART ENGINE
function drawCandles(ctx,W,H,t){t=t||ticker;var s=getSym(t),n=50,cw=(W-54)/n,base=parseFloat(s.p)||100,seed=0;for(var i=0;i<t.length;i++)seed+=t.charCodeAt(i);var rng=function(i){return(Math.abs(Math.sin(seed*9301+i*49297))%1);};var candles=[];for(var i=0;i<n;i++){var ch=(rng(i)-0.45)*0.025;var o=base,cl=base*(1+ch);candles.push({o:o,c:cl,h:Math.max(o,cl)*(1+rng(i+100)*0.005),l:Math.min(o,cl)*(1-rng(i+200)*0.005)});base=cl;}var hi=Math.max.apply(null,candles.map(function(c){return c.h})),lo=Math.min.apply(null,candles.map(function(c){return c.l})),pr=hi-lo||1;var yP=function(p){return 14+H-34-((p-lo)/pr)*(H-48);};ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(55,55,70,0.4)';ctx.lineWidth=0.5;ctx.font='8px monospace';ctx.textAlign='right';for(var i=0;i<=4;i++){var price=lo+(pr*i/4),y=yP(price);ctx.beginPath();ctx.moveTo(4,y);ctx.lineTo(W-50,y);ctx.stroke();ctx.fillStyle='#6b7280';ctx.fillText(price.toFixed(2),W-2,y+3);}var e20=base;ctx.strokeStyle='#8b5cf6';ctx.lineWidth=1;ctx.beginPath();candles.forEach(function(c,i){e20=c.c*0.095+e20*0.905;var x=4+i*cw+cw/2,y=yP(e20);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();candles.forEach(function(c,i){var x=4+i*cw+0.5,w=cw-1,bull=c.c>=c.o,col=bull?'#10b981':'#ef4444';ctx.strokeStyle=col;ctx.lineWidth=0.5;ctx.beginPath();ctx.moveTo(x+w/2,yP(c.h));ctx.lineTo(x+w/2,yP(c.l));ctx.stroke();ctx.fillStyle=col;ctx.fillRect(x,Math.min(yP(c.o),yP(c.c)),w,Math.max(Math.abs(yP(c.c)-yP(c.o)),1));});var lp=candles[n-1].c,ly=yP(lp);ctx.fillStyle='#8b5cf6';ctx.fillRect(W-50,ly-7,50,14);ctx.fillStyle='#fff';ctx.font='bold 8px monospace';ctx.textAlign='center';ctx.fillText(lp.toFixed(2),W-25,ly+3);ctx.textAlign='left';ctx.font='bold 10px sans-serif';ctx.fillStyle='#8b5cf6';ctx.fillText(t+' $'+s.p+' '+(s.c>=0?'+':'')+s.c+'%',4,12);}
function drawLine(ctx,W,H){var pts=[],seed=42;for(var i=0;i<50;i++)pts.push(0.3+Math.abs(Math.sin(seed+i*37))%1*0.5);var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),r=mx-mn||1;ctx.fillStyle='#0d0d14';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#8b5cf6';ctx.lineWidth=2;ctx.beginPath();pts.forEach(function(p,i){var x=(i/49)*W,y=H-10-((p-mn)/r)*(H-20);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();}
function drawGauge(ctx,W,H,v,label){var cx=W/2,cy=H*0.85,r=Math.min(W/2,H*0.65)-5;[[0,.25,'#ef4444'],[.25,.45,'#f59e0b'],[.45,.55,'#6b7280'],[.55,.75,'#10b981'],[.75,1,'#3b82f6']].forEach(function(z){ctx.beginPath();ctx.arc(cx,cy,r,Math.PI+z[0]*Math.PI,Math.PI+z[1]*Math.PI);ctx.strokeStyle=z[2];ctx.lineWidth=10;ctx.stroke();});var na=Math.PI+(v/100)*Math.PI;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(na)*r*0.8,cy+Math.sin(na)*r*0.8);ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText(Math.round(v),cx,cy-5);if(label){ctx.font='8px sans-serif';ctx.fillStyle='#9ca3af';ctx.fillText(label,cx,cy+10);}ctx.textAlign='left';}
function afterRender(){document.querySelectorAll('canvas[data-c]').forEach(function(cv){var dpr=window.devicePixelRatio||1;var rect=cv.getBoundingClientRect();cv.width=Math.max(1,rect.width*dpr);cv.height=Math.max(1,rect.height*dpr);var ctx=cv.getContext('2d');ctx.scale(dpr,dpr);var t=cv.getAttribute('data-c');if(t==='candles')drawCandles(ctx,rect.width,rect.height,cv.getAttribute('data-t'));else if(t==='line')drawLine(ctx,rect.width,rect.height);else if(t==='gauge')drawGauge(ctx,rect.width,rect.height,parseFloat(cv.getAttribute('data-v')),cv.getAttribute('data-l'));});}
// SMART WIZARD
function runSmartScan(){var pats=[{n:'Bullish Engulfing',a:'BUY',c:'success',d:'Large green engulfing prior red at support.'},{n:'Hammer',a:'BUY',c:'success',d:'Long lower wick. Buyers rejected lower prices.'},{n:'Morning Star',a:'BUY',c:'success',d:'3-candle bottom reversal. High reliability.'},{n:'Shooting Star',a:'SELL',c:'danger',d:'Long upper wick at resistance. Sellers dominated.'},{n:'Bearish Engulfing',a:'SELL',c:'danger',d:'Large red engulfing prior green at highs.'},{n:'Doji',a:'HOLD',c:'gold',d:'Indecision. Wait for confirmation.'}];var p=pats[Math.floor(Math.random()*pats.length)];var s=getSym(ticker),e=parseFloat(s.p),st=e*0.97,tg=e*1.05;if(p.a==='SELL'){st=e*1.03;tg=e*0.95;}var el=document.getElementById('sw');if(el)el.innerHTML='<div class="text-sm font-black text-white">'+p.n+'</div><div class="mt-1"><span class="text-[8px] bg-'+p.c+'/20 text-'+p.c+' px-2 py-0.5 rounded font-bold">'+p.a+'</span></div><p class="text-[9px] text-gray-400 mt-1">'+p.d+'</p><div class="grid grid-cols-3 gap-1 mt-2"><div class="bg-success/10 rounded p-1 text-center"><div class="text-[7px] text-success">Entry</div><div class="text-[10px] text-white">$'+e.toFixed(2)+'</div></div><div class="bg-danger/10 rounded p-1 text-center"><div class="text-[7px] text-danger">Stop</div><div class="text-[10px] text-white">$'+st.toFixed(2)+'</div></div><div class="bg-accent/10 rounded p-1 text-center"><div class="text-[7px] text-accent">Target</div><div class="text-[10px] text-white">$'+tg.toFixed(2)+'</div></div></div><div class="mt-2 text-[8px] text-'+p.c+' font-bold">NEXT MOVE: '+p.a+'</div>';}
// RENDERERS
var R={};
